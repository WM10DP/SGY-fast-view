<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Bottom Fast Viewer</title>
    <!-- Load Plotly for the Navigation Map -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 30px; 
        }

        .container { 
            max-width: 1440px; 
            margin: auto; 
        }

        header {
            margin-bottom: 24px;
        }

        h2 { 
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            margin: 0 0 8px 0; 
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin: 0;
        }

        .card {
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            margin-bottom: 24px;
        }

        .controls { 
            display: flex; 
            flex-wrap: wrap;
            gap: 24px; 
            align-items: center; 
        }

        input[type="file"] { 
            font-size: 14px; 
            color: var(--text-muted);
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.95rem;
            font-weight: 500;
        }

        input[type="range"] {
            accent-color: var(--primary);
            cursor: pointer;
        }

        #status { 
            font-weight: 500; 
            font-size: 0.95rem;
            color: var(--primary);
            margin-left: auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .btn-reset {
            background: #f1f5f9;
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-reset:hover {
            background: #e2e8f0;
        }

        /* Interactive Canvas Viewport */
        .canvas-viewport { 
            width: 100%;
            height: 600px; 
            background: #000000; 
            border: 1px solid var(--border-color); 
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .canvas-viewport:active {
            cursor: grabbing;
        }

        canvas { 
            display: block; 
            width: 100%;
            height: 100%;
        }

        .canvas-hud {
            position: absolute;
            bottom: 12px;
            left: 12px;
            background: rgba(15, 23, 42, 0.75);
            color: #f8fafc;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            pointer-events: none;
            backdrop-filter: blur(4px);
            letter-spacing: 0.3px;
        }

        #navMap { 
            width: 100%; 
            height: 600px; 
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Geophysical Sub-Bottom Fast Viewer</h2>
        <p class="subtitle">Client-side high performance SEG-Y trace and trackline visualizer.</p>
    </header>
    
    <div class="card">
        <div class="controls">
            <input type="file" id="sgyFile" accept=".sgy,.segy">
            <div class="slider-group">
                <label for="clipSlider">Amplitude Clip Percentile:</label>
                <input type="range" id="clipSlider" min="90" max="99.9" step="0.1" value="98">
                <span id="clipValue" style="min-width: 35px;">98</span>%
            </div>
            <span id="status">Waiting for file upload...</span>
        </div>
    </div>

    <div class="card">
        <div class="section-header">
            <div class="section-title">Sub-Bottom Profile (Blue-White-Red Seismic Palette)</div>
            <button class="btn-reset" id="resetViewBtn">Reset View & Zoom</button>
        </div>
        <div class="canvas-viewport" id="viewport">
            <canvas id="seismicCanvas"></canvas>
            <div class="canvas-hud">Controls: Scroll to zoom • Click & drag to pan</div>
        </div>
    </div>

    <div class="card">
        <div class="section-title" style="margin-bottom: 12px;">Survey Trackline (Navigation)</div>
        <div id="navMap"></div>
    </div>
</div>

<script>
    let globalTraces = [];
    let globalNavX = [];
    let globalNavY = [];
    
    // Offscreen rendering cache for fast pan/zoom performance
    let offscreenCanvas = document.createElement('canvas');
    let offscreenCtx = offscreenCanvas.getContext('2d');

    // Pan & Zoom View State
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;

    const sgyInput = document.getElementById('sgyFile');
    const clipSlider = document.getElementById('clipSlider');
    const clipValue = document.getElementById('clipValue');
    const statusTxt = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('seismicCanvas');
    const ctx = canvas.getContext('2d');
    const resetViewBtn = document.getElementById('resetViewBtn');

    // Resize canvas internal buffer to match container layout bounds
    function initCanvasSize() {
        const rect = viewport.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        drawScene();
    }
    window.addEventListener('resize', initCanvasSize);

    clipSlider.addEventListener('input', (e) => {
        clipValue.textContent = e.target.value;
    });

    clipSlider.addEventListener('change', () => {
        if(globalTraces.length > 0) {
            buildSeismicCache();
            drawScene();
        }
    });

    resetViewBtn.addEventListener('click', () => {
        resetView();
    });

    // Mouse Controls for Pan & Zoom
    viewport.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        drawScene();
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomIntensity = 0.12;
        const wheel = e.deltaY < 0 ? 1 : -1;
        const zoomFactor = Math.exp(wheel * zoomIntensity);

        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        // Zoom centered on mouse position
        panX = mouseX - (mouseX - panX) * zoomFactor;
        panY = mouseY - (mouseY - panY) * zoomFactor;
        scale *= zoomFactor;

        // Constrain zoom limits
        scale = Math.max(0.2, Math.min(scale, 50));

        drawScene();
    }, { passive: false });

    function resetView() {
        scale = 1;
        panX = 0;
        panY = 0;
        drawScene();
    }

    sgyInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        statusTxt.textContent = "Reading file into memory...";
        const reader = new FileReader();
        reader.onload = function(event) {
            statusTxt.textContent = "Parsing SEG-Y binary structures...";
            const arrayBuffer = event.target.result;
            parseSegy(arrayBuffer);
        };
        reader.readAsArrayBuffer(file);
    });

    function parseSegy(buffer) {
        try {
            const dataView = new DataView(buffer);
            const formatCode = dataView.getInt16(3224, false); 
            
            if (formatCode !== 5 && formatCode !== 1) {
                alert("Unsupported format code: " + formatCode + ". Please ensure export uses IEEE Float (Format 5).");
                statusTxt.textContent = "Error: Unsupported format.";
                return;
            }

            let offset = 3600; 
            globalTraces = [];
            globalNavX = [];
            globalNavY = [];
            
            statusTxt.textContent = "Extracting traces and navigation coordinates...";

            while (offset < buffer.byteLength) {
                let scalar = dataView.getInt16(offset + 70, false);
                let sx = dataView.getInt32(offset + 72, false);
                let sy = dataView.getInt32(offset + 76, false);
                let numSamples = dataView.getInt16(offset + 114, false);
                
                let mult = 1.0;
                if (scalar < 0) mult = 1.0 / Math.abs(scalar);
                else if (scalar > 0) mult = scalar;
                
                let actualX = sx * mult;
                let actualY = sy * mult;
                
                if (actualX !== 0 || actualY !== 0) {
                    globalNavX.push(actualX);
                    globalNavY.push(actualY);
                }

                let traceData = new Float32Array(numSamples);
                let traceOffset = offset + 240; 
                
                for (let i = 0; i < numSamples; i++) {
                    traceData[i] = dataView.getFloat32(traceOffset + (i * 4), false);
                }
                
                globalTraces.push(traceData);
                offset += 240 + (numSamples * 4);
            }

            initCanvasSize();
            buildSeismicCache();
            resetView();
            renderNavigation();
            statusTxt.textContent = `Success: Rendered ${globalTraces.length} traces.`;

        } catch (error) {
            console.error(error);
            statusTxt.textContent = "Error parsing file. Check console.";
        }
    }

    function buildSeismicCache() {
        if (globalTraces.length === 0) return;
        
        const width = globalTraces.length;
        const height = globalTraces[0].length; 
        
        offscreenCanvas.width = width;
        offscreenCanvas.height = height;

        let sampleValues = [];
        for (let i = 0; i < width; i += 10) { 
            for (let j = 0; j < height; j += 10) {
                sampleValues.push(Math.abs(globalTraces[i][j]));
            }
        }
        sampleValues.sort((a, b) => a - b);
        let pctIndex = Math.floor(sampleValues.length * (parseFloat(clipSlider.value) / 100));
        let clipVal = sampleValues[pctIndex];

        const imgData = offscreenCtx.createImageData(width, height);
        let dataIndex = 0;
        
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                let val = globalTraces[x][y];
                
                if (val > clipVal) val = clipVal;
                if (val < -clipVal) val = -clipVal;
                
                let normalized = (val + clipVal) / (2 * clipVal);
                let r = 0, g = 0, b = 0;
                
                if (normalized < 0.5) {
                    let t = normalized * 2; 
                    r = Math.round(16 + t * (255 - 16));  
                    g = Math.round(78 + t * (255 - 78));  
                    b = Math.round(139 + t * (255 - 139));
                } else {
                    let t = (normalized - 0.5) * 2; 
                    r = Math.round(255 - t * (255 - 139)); 
                    g = Math.round(255 - t * 255);         
                    b = Math.round(255 - t * 255);         
                }

                imgData.data[dataIndex++] = r; 
                imgData.data[dataIndex++] = g; 
                imgData.data[dataIndex++] = b; 
                imgData.data[dataIndex++] = 255; 
            }
        }
        offscreenCtx.putImageData(imgData, 0, 0);
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (globalTraces.length === 0) return;

        ctx.save();
        ctx.translate(panX, panY);
        ctx.scale(scale, scale);
        
        // Draw cached offscreen seismic image onto interactive viewport canvas
        ctx.drawImage(offscreenCanvas, 0, 0);
        ctx.restore();
    }

    function renderNavigation() {
        if (globalNavX.length === 0) return;

        const traceLine = {
            x: globalNavX,
            y: globalNavY,
            mode: 'lines',
            name: 'Vessel Track',
            line: {color: '#2563eb', width: 2}
        };

        const startPoint = {
            x: [globalNavX[0]],
            y: [globalNavY[0]],
            mode: 'markers',
            name: 'Start of Line',
            marker: {color: '#16a34a', size: 10, symbol: 'circle'}
        };

        const endPoint = {
            x: [globalNavX[globalNavX.length - 1]],
            y: [globalNavY[globalNavY.length - 1]],
            mode: 'markers',
            name: 'End of Line',
            marker: {color: '#dc2626', size: 10, symbol: 'square'}
        };

        const layout = {
            margin: { t: 30, r: 30, b: 40, l: 60 },
            xaxis: { title: 'Easting / Longitude', scaleanchor: "y", scaleratio: 1, gridcolor: '#f1f5f9' },
            yaxis: { title: 'Northing / Latitude', gridcolor: '#f1f5f9' },
            showlegend: true,
            paper_bgcolor: 'transparent',
            plot_bgcolor: 'transparent'
        };

        Plotly.newPlot('navMap', [traceLine, startPoint, endPoint], layout, {responsive: true});
    }
</script>

</body>
</html>
