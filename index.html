    hitsAc: feat ? feat/dxE : NaN, hitsAl: feat ? feat/dy : NaN, vmax: feat ? feat*prf*sw/3/KN : NaN};

  // lines in run order
  const Rt = (p.speed*1852/60)/(p.rot*D2R), runin = p.runin, runout = p.runout, ext = p.ext||0;
  const names = new Set(), uniq = nm => { let s = nm; while (names.has(s)) s += "b"; names.add(s); return s; };
  const mk = (name, kind, a, b, x) => { const len = Math.hypot(b[0]-a[0], b[1]-a[1]), u = [(b[0]-a[0])/len, (b[1]-a[1])/len];
    return Object.assign({name, kind, a, b, len, u, join:[a[0]-u[0]*runin, a[1]-u[1]*runin], vend:[b[0]+u[0]*runout, b[1]+u[1]*runout], vessel:runin+len+runout}, x); };
  const seq = exts.map((e, i) => { const nm = Math.abs(e.off) < 0.05 ? "MB-CL" : `MB-${e.off < 0 ? "P" : "S"}${pad4(e.off)}`;
    return mk(uniq(nm), "main", [e.off, e.dir > 0 ? -ext : length+ext], [e.off, e.dir > 0 ? length+ext : -ext], {dir:e.dir, off:e.off, e, sw:e.L.x + e.R.x}); });
  const nX = Math.round(p.xlines||0), last = seq[seq.length-1], xr = Math.max(half, Math.abs(exts[0].off));
  if (nX > 0){
    let kps = Array.from({length:nX}, (_, j) => length*(j+0.5)/nX); if (last.dir > 0) kps.reverse();
    let side = last.off >= 0 ? 1 : -1;
    kps.forEach((kp, j) => { seq.push(mk(uniq(`XL-${String(j+1).padStart(2,"0")}`), "cross", [side*xr, kp], [-side*xr, kp], {dir:0, kp})); side = -side; });
  }
  const cost = (a, b) => a.kind === "main" && b.kind === "main" ? turnLen(Math.abs(a.off-b.off), Math.abs(a.vend[1]-b.join[1]), Rt)
    : Math.hypot(a.vend[0]-b.join[0], a.vend[1]-b.join[1]) + Math.PI*Rt/2;
  seq.forEach((l, i) => { l.order = i+1; l.turn = i < seq.length-1 ? cost(l, seq[i+1]) : 0; });

  // hours
  const kmh = p.speed*1.852, Hh = mm => mm/1000/kmh, sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
  const mainL = seq.filter(l => l.kind === "main"), crossL = seq.filter(l => l.kind === "cross"), hrs = {};
  hrs.dataMain = Hh(sum(mainL, l => l.len)); hrs.runMain = Hh(sum(mainL, l => l.vessel - l.len));
  hrs.cross = Hh(sum(crossL, l => l.vessel)); hrs.turns = Hh(sum(seq, l => l.turn));
  hrs.survey = hrs.dataMain + hrs.runMain + hrs.cross + hrs.turns;
  hrs.svpN = 1 + Math.floor(hrs.survey/p.svpInt); hrs.svp = hrs.svpN*p.svpDur;
  hrs.infill = hrs.survey*p.infill/100; hrs.pre = p.pre||0;
  hrs.subtotal = hrs.pre + hrs.survey + hrs.svp + hrs.infill;
  hrs.cont = hrs.subtotal*(p.cont||0)/100; hrs.total = hrs.subtotal + hrs.cont; hrs.days = hrs.total/p.dayH;
  const dataKm = sum(seq, l => l.len)/1000;

  return {p, M, m, O, surface, H, Hd, ts, corridor, length, half, c, W, Weff, S, sAuto, two, need, n, exts, ovMin, foldMin, covL, covR, anyLim,
    ac, ord, seq, nX, Rt, hrs, dataKm, ext, errors:[]};
}

/* ---------- checks ---------- */
function checks(r){
  const p = r.p, out = [], add = (s, t) => out.push([s, t]), a = r.ac, deg = x => fmt(x/D2R, 1);
  add(r.anyLim ? "warn" : "ok", r.anyLim
    ? `<b>Swath is range-limited.</b> The outer beams would pass the ${fmt(r.m.rng)} m reach at ${p.freq} kHz${r.m.e ? " (est.)" : ""}, or point at or above horizontal, so the usable sector at the centre line is ${deg(r.c.L.a)}° port and ${deg(r.c.R.a)}° starboard. Narrow the sector or use a lower frequency.`
    : `<b>Full ${fmt(p.sector)}° sector reaches the seabed.</b> Slant range to the swath edge is ${fmt(a.rEdge,1)} m against about ${fmt(r.m.rng)} m of reach at ${p.freq} kHz${r.m.e ? " (est.)" : ""}.`);
  add("ok", `<b>Coverage ${r.two ? "≥ 200 %" : "100 %"}</b> across the ${fmt(r.corridor)} m ${p.mode === "route" ? "corridor" : "area width"} with ${r.n} line${r.n > 1 ? "s" : ""}: the swaths span ${r.covL < 0 ? "P" : "S"} ${fmt(Math.abs(r.covL))} m to ${r.covR < 0 ? "P" : "S"} ${fmt(Math.abs(r.covR))} m.`);
  if (r.O.cov === 200) add(r.two ? "ok" : "bad", r.two ? `<b>${r.O.label}</b> asks for 200 % coverage, which this plan gives.` : `<b>${r.O.label} asks for 200 % coverage.</b> Switch the coverage to 200 %.`);
  else if (r.O.cov === 100 && isFinite(r.ovMin)) add(r.ovMin > 0 ? "ok" : "bad", `<b>${r.O.label}</b> asks for ${r.O.covTxt}. Neighbouring swaths overlap by at least ${fmt(r.ovMin,1)} m.`);
  if (isFinite(r.ovMin) && !r.two){ const pc = r.ovMin/(r.ovMin + r.S)*100;
    add(pc >= 10 ? "ok" : "warn", `<b>Overlap ${fmt(pc,1)} %</b> (${fmt(r.ovMin,1)} m) at the tightest pair of lines. ${pc >= 10 ? "That leaves room for line-keeping and for depth shoaling between lines." : "Under 10 % leaves little room for line-keeping error, roll or shoaling: raise the overlap."}`); }
  if (r.ord.feat){
    const okA = r.ord.hitsAc >= 3, okL = r.ord.hitsAl >= 3;
    add(okA ? "ok" : "warn", `<b>${fmt(r.ord.hitsAc,1)} soundings across</b> a ${fmt(r.ord.feat, r.ord.feat % 1 ? 1 : 0)} m feature at the swath edge (sounding spacing ${cm(a.dxE)}). ${okA ? "Meets" : "Below"} the 3-across working rule${okA ? "" : ": narrow the sector, switch to equidistant beams or use more beams"}.`);
    add(okL ? "ok" : "warn", `<b>${fmt(r.ord.hitsAl,1)} pings along</b> a ${fmt(r.ord.feat, r.ord.feat % 1 ? 1 : 0)} m feature at ${fmt(p.speed,1)} kn (${cm(a.dy)} between swaths). ${okL ? `Speed could rise to ${fmt(r.ord.vmax,1)} kn` : `Slow to ${fmt(r.ord.vmax,1)} kn or less${r.M.ds && !p.dualSwath ? ", or use dual swath" : ""}, or narrow the sector to raise the ping rate`}.`);
    const fpOk = a.fpAcE <= r.ord.feat;
    add(fpOk ? "ok" : "warn", `<b>Beam footprint at the swath edge</b> is ${cm(a.fpAcE)} across by ${cm(a.fpAlE)} along, against a ${fmt(r.ord.feat, r.ord.feat % 1 ? 1 : 0)} m feature. ${fpOk ? "Smaller than the feature." : "Wider than the feature: the outer beams rely on phase detection, so treat small-feature detection there with care."}`);
  } else add("info", `<b>${r.O.label}</b> has no feature-detection requirement (${r.O.covTxt}). Density at the swath edge is ${fmt(a.densE, a.densE < 10 ? 1 : 0)} soundings per m².`);
  const eMax = Math.max(r.c.L.a, r.c.R.a)/D2R;
  if (eMax > 65 + 1e-6) add(p.order === "EX" || p.order === "SP" ? "warn" : "info", `<b>Outer beams at ${fmt(eMax,1)}° from nadir.</b> Beyond about 60–65° the depths are sensitive to sound velocity and roll errors. Many ${p.order === "EX" || p.order === "SP" ? "Special and Exclusive Order" : "survey"} specifications cap the accepted sector near ±60–65°: check yours.`);
  else add("ok", `<b>Outer beams at ${fmt(eMax,1)}° from nadir</b>, inside the ±60–65° band where sound velocity and roll errors stay manageable.`);
  if (p.tilt !== 0) add("info", `<b>Sector steered ${fmt(Math.abs(p.tilt))}° to ${p.tilt > 0 ? "starboard" : "port"}.</b> Lines run in alternate directions, so the steered side flips on every second line. The spacing here is set by the narrow sides meeting (${fmt(r.Weff,1)} m usable swath).`);
  if (p.slope !== 0) add("info", r.surface
    ? `<b>Cross-slope ${fmt(Math.abs(p.slope))}°.</b> Depth under the sonar runs from ${fmt(r.H - r.half*Math.abs(r.ts),1)} m to ${fmt(r.H + r.half*Math.abs(r.ts),1)} m across the width. Spacing is fixed at the shallow-edge value, so deeper lines overlap more. Where you can, run lines along the contours as planned here.`
    : `<b>Cross-slope ${fmt(Math.abs(p.slope))}°.</b> The swath reaches further down-slope than up-slope; spacing uses the narrower pairing.`);
  if (a.prf >= r.M.prf - 1e-9) add("info", `<b>Ping rate at the ${fmt(r.M.prf)} Hz system maximum.</b> Range is not the limit here.`);
  if (!r.surface && r.M.rate){ const sd = p.wd - p.alt; add(sd <= r.M.rate ? "ok" : "warn", `<b>Sonar depth ${fmt(sd)} m</b> against a head rating of ${r.M.rateTxt}.`); }
  else if (!r.surface) add("info", `<b>Sonar depth ${fmt(p.wd - p.alt)} m.</b> Check the depth rating of the transducers fitted.`);
  add("info", `<b>Turns:</b> radius about ${fmt(r.Rt)} m at ${fmt(p.speed,1)} kn and ${fmt(p.rot)}°/min. A ${fmt(p.runin)} m run-in lets heave and heading settle before each line.`);
  if (r.nX === 0) add("warn", `<b>No cross lines.</b> Run at least one or two across the main lines to check the depths against each other.`);
  return out;
}

/* ---------- drawing: palette ---------- */
const VARS = ["bg","panel","panel-2","ink","muted","line","accent","accent-soft","seta","setb","hf","nadir","seabed","water","fold1","fold2","fold3"];
const pageC = Object.fromEntries(VARS.map(v => [v, `var(--${v})`]));
function resolvedC(){ const cs = getComputedStyle(document.documentElement); return Object.fromEntries(VARS.map(v => [v, cs.getPropertyValue(`--${v}`).trim()])); }
const MONO = "IBM Plex Mono, ui-monospace, Menlo, monospace";
const T = (x, y, s, C, o={}) => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="fill:${o.fill||C.ink};font:${o.w||400} ${o.size||11}px ${MONO}" text-anchor="${o.a||"start"}"${o.dom?` dominant-baseline="${o.dom}"`:""}>${esc(s)}</text>`;
const Rc = (x, y, w, h, st) => `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(0,w).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" style="${st}"/>`;
const Ln = (x1, y1, x2, y2, st) => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" style="${st}"/>`;
function dimH(x1, x2, y, label, C, above=true, col){
  const st = `stroke:${col||C.ink};stroke-width:1`;
  return Ln(x1,y,x2,y,st) + Ln(x1,y-4,x1,y+4,st) + Ln(x2,y-4,x2,y+4,st) +
    T((x1+x2)/2, above ? y-5 : y+14, label, C, {a:"middle", size:12, w:500, fill:col});
}
function niceStep(span, target){ const raw = span/target, mg = Math.pow(10, Math.floor(Math.log10(raw))); for (const k of [1,2,2.5,5,10]) if (k*mg >= raw) return k*mg; return 10*mg; }

/* ---------- front-view swath ---------- */
let FV = null;
function frontSVG(r, C, opt){
  const p = r.p, VW = 1100, padL = 66, padR = 26, padT = 50, plotW = VW - padL - padR, plotH = 340;
  const mi = Math.floor((r.n - 1)/2), main = r.exts[mi];
  const shown = opt.adj ? r.exts.filter((_, i) => Math.abs(i - mi) <= 1) : [main];
  const K = r.surface ? 0 : -Math.min(...shown.map(e => e.off*r.ts));
  const base = r.surface ? p.draft + r.H : r.H + K;
  const zb = x => base + x*r.ts, zs = e => zb(e.off) - e.Hi;
  let xMin = Math.min(...shown.map(e => e.off - e.L.x)), xMax = Math.max(...shown.map(e => e.off + e.R.x));
  const padX = Math.max((xMax - xMin)*0.05, 1); xMin -= padX; xMax += padX;
  const zMax = Math.max(zb(xMin), zb(xMax), zb(main.off))*1.22;
  const X = mm => padL + (mm - xMin)/(xMax - xMin)*plotW, Y = z => padT + z/zMax*plotH;
  const stripY = padT + plotH + 74, rowH = 16, VH = stripY + rowH + 40;
  FV = {VW, VH, padL, padT, plotW, plotH, xMin, xMax, zMax};
  let g = Rc(0, 0, VW, VH, `fill:${C.panel}`);
  g += `<defs><clipPath id="fvClip"><rect x="${padL}" y="${padT}" width="${plotW}" height="${plotH}"/></clipPath></defs>`;
  g += Rc(padL, padT, plotW, plotH, `fill:${C.water}`);
  // grid and axes
  const xs = niceStep(xMax - xMin, 10), zstep = niceStep(zMax, 6);
  for (let v = Math.ceil(xMin/xs)*xs; v <= xMax + 1e-9; v += xs){
    g += Ln(X(v), padT, X(v), padT+plotH, `stroke:${C.line};stroke-width:1`);
    g += T(X(v), padT+plotH+15, Math.abs(v) < 1e-9 ? "CL" : `${v < 0 ? "P" : "S"} ${fmt(Math.abs(v), xs < 1 ? 1 : 0)}`, C, {a:"middle", size:10, fill:C.muted});
  }
  for (let v = 0; v <= zMax + 1e-9; v += zstep){
    g += Ln(padL, Y(v), padL+plotW, Y(v), `stroke:${C.line};stroke-width:1`);
    g += T(padL-8, Y(v), fmt(v, zstep < 1 ? 1 : 0), C, {a:"end", size:10, fill:C.muted, dom:"middle"});
  }
  g += T(padL + plotW/2, padT+plotH+32, "Across-track distance from the centre line (m)", C, {a:"middle", size:10.5, fill:C.muted});
  g += `<text transform="translate(16,${(padT+plotH/2).toFixed(1)}) rotate(-90)" text-anchor="middle" style="fill:${C.muted};font:400 10.5px ${MONO}">${r.surface ? "Depth below sea surface (m)" : "Depth below the shallowest vehicle (m)"}</text>`;
  let cg = "";
  // seabed
  cg += `<polygon points="${X(xMin).toFixed(1)},${Y(zb(xMin)).toFixed(1)} ${X(xMax).toFixed(1)},${Y(zb(xMax)).toFixed(1)} ${X(xMax).toFixed(1)},${padT+plotH} ${X(xMin).toFixed(1)},${padT+plotH}" style="fill:${C.seabed}"/>`;
  cg += Ln(X(xMin), Y(zb(xMin)), X(xMax), Y(zb(xMax)), `stroke:${C.ink};stroke-width:1.6`);
  const fan = e => { const z0 = zs(e); return [[X(e.off), Y(z0)], [X(e.off - e.L.x), Y(z0 + e.L.z)], [X(e.off + e.R.x), Y(z0 + e.R.z)]]; };
  const pts = a => a.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join(" ");
  // adjacent lines
  for (const e of shown){ if (e === main) continue; const f = fan(e);
    cg += `<polygon points="${pts(f)}" style="fill:${C.hf};fill-opacity:.07;stroke:${C.hf};stroke-opacity:.8;stroke-width:1;stroke-dasharray:5 4"/>`; }
  // main fan and rays
  const f0 = fan(main);
  cg += `<polygon points="${pts(f0)}" style="fill:${C.seta};fill-opacity:.16;stroke:${C.seta};stroke-width:1.8"/>`;
  if (opt.rays){ const aL = main.L.a, aR = main.R.a, z0 = zs(main);
    for (let j = 1; j < 16; j++){ const ph = -aL + (aL + aR)*j/16, k = ph < 0 ? -1 : 1, q = reach(main.Hi, Math.abs(ph), k, r.ts, 1e9);
      cg += Ln(X(main.off), Y(z0), X(main.off + k*q.x), Y(z0 + q.z), `stroke:${C.seta};stroke-opacity:.3;stroke-width:.8`); } }
  // nadir
  cg += Ln(X(main.off), Y(zs(main)), X(main.off), Y(zb(main.off)), `stroke:${C.nadir};stroke-width:1.2;stroke-dasharray:3 3`);
  // overlap bands on the seabed
  let lab = "";
  if (opt.overlap && opt.adj){ const so = [...shown].sort((a, b) => a.off - b.off);
    for (let i = 0; i < so.length - 1; i++){ const x0 = so[i+1].off - so[i+1].L.x, x1 = so[i].off + so[i].R.x;
      if (x1 > x0){ cg += `<polygon points="${X(x0).toFixed(1)},${Y(zb(x0)).toFixed(1)} ${X(x1).toFixed(1)},${Y(zb(x1)).toFixed(1)} ${X(x1).toFixed(1)},${(Y(zb(x1))+7).toFixed(1)} ${X(x0).toFixed(1)},${(Y(zb(x0))+7).toFixed(1)}" style="fill:${C.accent}"/>`;
        if (X(x1) - X(x0) > 40) lab += T((X(x0)+X(x1))/2, Y(zb((x0+x1)/2)) + 20, `overlap ${fmt(x1-x0, x1-x0 < 10 ? 1 : 0)} m`, C, {a:"middle", size:10.5, w:600, fill:C.accent}); } } }
  // sonar heads
  for (const e of shown){ const col = e === main ? C.seta : C.hf, x = X(e.off), y = Y(zs(e));
    if (r.surface) cg += `<path d="M${(x-16).toFixed(1)},${padT} L${(x+16).toFixed(1)},${padT} L${(x+11).toFixed(1)},${(y-3).toFixed(1)} L${(x-11).toFixed(1)},${(y-3).toFixed(1)} Z" style="fill:${col};fill-opacity:.35"/>`;
    cg += Rc(x-7, y-4, 14, 8, `fill:${col};stroke:${C.panel};stroke-width:1`); }
  g += `<g clip-path="url(#fvClip)">${cg}${lab}</g>`;
  g += Rc(padL, padT, plotW, plotH, `fill:none;stroke:${C.muted};stroke-width:1`);
  // dimensions
  const eY = Math.min(padT + plotH - 8, Math.max(f0[1][1], f0[2][1]) + 36);
  g += dimH(f0[1][0], f0[2][0], eY, `swath W = ${fmt(main.L.x + main.R.x, 1)} m`, C, false, C.seta);
  const nb = shown.find(e => e.off > main.off) || shown.find(e => e.off < main.off);
  if (nb) g += dimH(Math.min(X(main.off), X(nb.off)), Math.max(X(main.off), X(nb.off)), padT - 14, `line spacing S = ${fmt(r.S, r.S < 5 ? 1 : 0)} m`, C, true, C.hf);
  const zh = Y(zs(main));
  g += T(X(main.off) - 12, zh + 26, `${fmt(main.L.a/D2R, 1)}°`, C, {a:"end", size:11, fill:C.seta, w:600});
  g += T(X(main.off) + 12, zh + 26, `${fmt(main.R.a/D2R, 1)}°`, C, {size:11, fill:C.seta, w:600});
  g += T(X(main.off) + 6, (zh + Y(zb(main.off)))/2, `H ${fmt(main.Hi, 1)} m`, C, {size:11, fill:C.nadir, dom:"middle"});
  g += T(padL + plotW, padT - 30, `line ${esc(r.seq[mi].name)} and its neighbours · vertical ×${fmt((plotH/zMax)/(plotW/(xMax-xMin)), 1)}`, C, {a:"end", size:10, fill:C.muted});
  g += `<line id="fvCx" x1="0" x2="0" y1="${padT}" y2="${padT+plotH}" style="stroke:${C.ink};stroke-width:.8;stroke-dasharray:2 2;visibility:hidden"/><line id="fvCy" x1="${padL}" x2="${padL+plotW}" y1="0" y2="0" style="stroke:${C.ink};stroke-width:.8;stroke-dasharray:2 2;visibility:hidden"/>`;
  // coverage strip, all lines, own horizontal scale
  const hs = Math.max(r.half, -r.covL, r.covR)*1.04, Xs = mm => padL + (mm + hs)/(2*hs)*plotW;
  g += T(padL, stripY - 8, `Coverage across the full ${p.mode === "route" ? "corridor" : "area"} · all ${r.n} line${r.n > 1 ? "s" : ""}`, C, {size:10.5, w:600});
  const st = Math.max(0.1, hs/700), foldCol = k => k <= 0 ? null : k === 1 ? C.fold1 : k === 2 ? C.fold2 : C.fold3;
  let x0 = -hs, cur = null;
  for (let x = -hs; x <= hs + st; x += st){ const f = x > hs ? -1 : foldAt(x, r.exts);
    if (cur === null){ cur = f; x0 = x; continue; }
    if (f !== cur){ const col = foldCol(cur); if (col) g += Rc(Xs(x0), stripY, (x - x0)/(2*hs)*plotW + 0.3, rowH, `fill:${col}`); x0 = x; cur = f; } }
  g += Rc(padL, stripY, plotW, rowH, `fill:none;stroke:${C.line};stroke-width:1`);
  if (r.n <= 120) for (const e of r.exts) g += Ln(Xs(e.off), stripY - 3, Xs(e.off), stripY + rowH + 3, `stroke:${e === main ? C.seta : C.muted};stroke-width:${e === main ? 2 : 1}`);
  for (const s of [-1, 1]) g += Ln(Xs(s*r.half), stripY - 6, Xs(s*r.half), stripY + rowH + 6, `stroke:${C.nadir};stroke-width:1;stroke-dasharray:4 3`);
  const ss = niceStep(2*hs, 8);
  for (let v = -Math.floor(hs/ss)*ss; v <= hs; v += ss) g += T(Xs(v), stripY + rowH + 17, Math.abs(v) < 1e-9 ? "CL" : `${v < 0 ? "P" : "S"} ${fmt(Math.abs(v))}`, C, {a:"middle", size:10, fill:C.muted});
  g += T(padL + plotW, stripY + rowH + 32, "dashed red: survey limits · ticks: run-lines", C, {a:"end", size:9.5, fill:C.muted});
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VW} ${VH}" role="img" aria-label="Front view of the multibeam swath, adjacent lines and overlap">${g}</svg>`;
}

/* ---------- plan view ---------- */
function planSVG(r, C){
  const VW = 1100, padL = 70, padR = 34, padT = 40, seq = r.seq, L = r.length, half = r.half;
  const allY = seq.flatMap(l => [l.join[1], l.vend[1], l.a[1], l.b[1]]), allO = seq.flatMap(l => [l.join[0], l.vend[0]]);
  const tp = Math.min(160, r.Rt*0.8), yMin = Math.min(...allY, 0) - tp, yMax = Math.max(...allY, L) + tp;
  const oMax = Math.max(half, ...allO.map(Math.abs))*1.1;

    `${p.mode === "route" ? `Route ${fmt(r.length/1000,2)} km, corridor ${fmt(r.corridor)} m` : `Area ${fmt(r.corridor)} m wide × ${fmt(r.length)} m long (${fmt(r.corridor*r.length/1e6,2)} km²)`}, water depth ${fmt(p.wd)} m, ${r.surface ? `head draft ${fmt(p.draft,1)} m` : `vehicle altitude ${fmt(p.alt,1)} m`}${p.slope ? `, cross-slope ${fmt(p.slope)}°` : ""}`,
    `Swath ${fmt(r.W,1)} m (${fmt(r.W/r.H,2)} × height), ${r.two ? "200" : "100"} % coverage, line spacing ${fmt(r.S,1)} m${isFinite(r.ovMin) ? `, overlap ${fmt(r.ovMin,1)} m` : ""}`,
    `${r.n} main lines${r.nX ? ` + ${r.nX} cross lines` : ""}, ${fmt(r.dataKm,1)} km of line`,
    `Speed ${fmt(p.speed,1)} kn, ping rate ${fmt(a.prf,1)} Hz${a.sw > 1 ? " dual swath" : ""}, mean density ${fmt(a.densAvg, a.densAvg < 10 ? 1 : 0)} soundings/m², footprint ${cm(a.fpAcN)} at nadir and ${cm(a.fpAcE)} at the edge`,
    `${r.O.label}: allowed TVU ± ${fmt(r.ord.tvu,2)} m, THU ± ${fmt(r.ord.thu,1)} m${r.ord.feat ? `, feature ${fmt(r.ord.feat,1)} m with ${fmt(r.ord.hitsAc,1)} × ${fmt(r.ord.hitsAl,1)} soundings at the edge` : ""}`,
    `Hours: mobilisation ${fmt(h.pre,2)}, survey incl. run-ins, cross lines and turns ${fmt(h.survey,2)}, SVP ${fmt(h.svp,2)}, infill ${fmt(h.infill,2)}`,
    `Subtotal ${fmt(h.subtotal,2)} h + contingency ${fmt(p.cont)} % = ${fmt(h.total,2)} h (${fmt(h.days,2)} day at ${p.dayH} h/day)`
  ].join("\n");
}
let toastT;
function toast(msg, bad){ const t = $("toast"); t.textContent = msg; t.style.color = bad ? "var(--bad)" : "var(--ok)"; clearTimeout(toastT); toastT = setTimeout(() => t.textContent = "", 4000); }
let downloads = null;
async function saveFile(filename, data){
  if (!downloads) return;
  try { await downloads.save({filename, data}); toast(`Saved ${filename}`); }
  catch (e) { const code = e && e.code;
    if (code === "declined") toast("Download cancelled."); else if (code === "rate_limited") toast("Another save is waiting for your answer.", true); else toast("This view can't save files.", true); }
}
$("csvBtn").addEventListener("click", () => LAST && saveFile("mbes_runlines.csv", csvText(LAST)));
$("dxfBtn").addEventListener("click", async () => {
  if (!LAST) return;
  if (!window.JSZip){ toast("The zip library did not load, so the DXF can't be packed.", true); return; }
  const zip = new JSZip(); zip.file("mbes_runlines.dxf", dxfText(LAST)); zip.file("mbes_runlines.csv", csvText(LAST));
  saveFile("mbes_runlines_dxf.zip", await zip.generateAsync({type:"blob"}));
});
$("pngBtn").addEventListener("click", () => {
  if (!LAST) return;
  const svg = planSVG(LAST, resolvedC()), mm = svg.match(/viewBox="0 0 (\d+) (\d+)"/), w = +mm[1], h = +mm[2], k = 2, img = new Image();
  img.onload = () => { const cv = document.createElement("canvas"); cv.width = w*k; cv.height = h*k;
    const cx = cv.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => b ? saveFile("mbes_runline_plan.png", b) : toast("The picture could not be made.", true), "image/png"); };
  img.onerror = () => toast("The picture could not be made.", true);
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg.replace("<svg ", `<svg width="${w}" height="${h}" `));
});
$("svgBtn").addEventListener("click", () => LAST && saveFile("mbes_front_view_swath.svg", frontSVG(LAST, resolvedC(), viewOpt())));
$("copyBtn").addEventListener("click", () => {
  if (!LAST) return; const txt = summaryText(LAST);
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast("Summary copied."), () => fallbackCopy(txt));
  else fallbackCopy(txt);
});
function fallbackCopy(txt){
  const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch(e){}
  document.body.removeChild(ta); toast(ok ? "Summary copied." : "Copy is blocked here. Select the run-line table instead.", !ok);
}
(async () => {
  try {
    if (window.claude && typeof window.claude.use === "function") downloads = await window.claude.use("downloads");
    else downloads = { save: async ({filename, data}) => {
      const blob = data instanceof Blob ? data : new Blob([data], {type:"application/octet-stream"});
      const url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); return {status:"saved"}; }};
    if (downloads) ["csvBtn","dxfBtn","svgBtn","pngBtn"].forEach(id => $(id).hidden = false);
  } catch(e){ downloads = null; }
})();

/* ---------- storage (per-viewer convenience) ---------- */
const KEY = "mbes-runline-planner-v1";
let saveT;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(snapshot())); } catch(e){} }, 400); }
function snapshot(){
  const o = {};
  [...NUM_IDS, ...SEL_IDS].forEach(id => o[id] = $(id).value);
  CHK_IDS.forEach(id => o[id] = $(id).checked);
  for (const [k, ids] of Object.entries(RADIO)) o[k] = ($(ids.find(i => $(i).checked)) || $(ids[0])).value;
  return o;
}

/* ---------- wiring ---------- */
$("model").innerHTML = Object.entries(MODELS).map(([k, mm]) => `<option value="${k}">${esc(mm.label)}</option>`).join("");
$("order").innerHTML = Object.entries(ORDERS).map(([k, o]) => `<option value="${k}">${esc(o.label)}</option>`).join("");
function applySectorDefault(){
  const p = readParams(), M = getModel(p), sm = secMaxOf(p, M, getMode(M, p.freq));
  $("sector").value = Math.min(120, sm.max); $("tilt").value = 0;
}
let raf = 0;
function schedule(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; try { render(); } catch(e){ console.error(e); } }); }
$("model").addEventListener("change", () => { populateFreq(); $("freq").value = String(getModel({model:$("model").value}).def); syncVisibility(); applySectorDefault(); commitLimits(); schedule(); });
$("freq").addEventListener("change", () => { applySectorDefault(); commitLimits(); schedule(); });
$("resetBtn").addEventListener("click", () => { try { localStorage.removeItem(KEY); } catch(e){} writeParams(DEFAULTS); schedule(); });
$("form").addEventListener("input", schedule);
$("form").addEventListener("change", e => { if (e.target && (LIM_IDS.includes(e.target.id) || e.target.type === "radio" || e.target.type === "checkbox")) commitLimits(); schedule(); });
$("form").addEventListener("submit", e => e.preventDefault());
["showRays","showOverlap","showAdj"].forEach(id => $(id).addEventListener("change", schedule));
function fvHover(ev){
  if (!FV) return;
  const svg = $("fvWrap").querySelector("svg"); if (!svg) return;
  const rc = svg.getBoundingClientRect(), pt = ev.touches ? ev.touches[0] : ev;
  const px = (pt.clientX - rc.left)/rc.width*FV.VW, py = (pt.clientY - rc.top)/rc.height*FV.VH;
  const cx = svg.querySelector("#fvCx"), cy = svg.querySelector("#fvCy");
  if (px < FV.padL || px > FV.padL + FV.plotW || py < FV.padT || py > FV.padT + FV.plotH){ fvLeave(); return; }
  const x = FV.xMin + (px - FV.padL)/FV.plotW*(FV.xMax - FV.xMin), z = (py - FV.padT)/FV.plotH*FV.zMax;
  cx.setAttribute("x1", px); cx.setAttribute("x2", px); cx.style.visibility = "visible";
  cy.setAttribute("y1", py); cy.setAttribute("y2", py); cy.style.visibility = "visible";
  $("cursorPos").textContent = `X: ${Math.abs(x) < 0.05 ? "CL" : (x < 0 ? "P " : "S ") + fmt(Math.abs(x),1) + " m"} | depth: ${fmt(z,1)} m`;
}
function fvLeave(){ const svg = $("fvWrap").querySelector("svg"); if (svg) ["#fvCx","#fvCy"].forEach(s => { const el = svg.querySelector(s); if (el) el.style.visibility = "hidden"; }); $("cursorPos").textContent = "X: – m | depth: – m"; }
$("fvWrap").addEventListener("mousemove", fvHover);
$("fvWrap").addEventListener("touchstart", fvHover, {passive:true});
$("fvWrap").addEventListener("touchmove", fvHover, {passive:true});
$("fvWrap").addEventListener("mouseleave", fvLeave);

// start: saved state, else the defaults
let start = DEFAULTS;
try { const s = localStorage.getItem(KEY); if (s) { const o = JSON.parse(s); if (o && MODELS[o.model]) start = Object.assign({}, DEFAULTS, o); } } catch(e){}
writeParams(start);
render();
})();
<\/script>
</body>
</html>
</script>

<script type="text/plain" id="src-sbp">
<!DOCTYPE html>

/* =====================================================================

function fillTable(tbody, rows) {

const TRACE_FIELDS = [
  [1,4,'Trace seq. in line (tracl)'],[5,4,'Trace seq. in file (tracr)'],[9,4,'Field record / FFID (fldr)'],[13,4,'Trace in field record (tracf)'],

  [171,2,'Geophone group no. roll sw 1'],[173,2,'Geophone group no. first'],[175,2,'Geophone group no. last'],[177,2,'Gap size'],[179,2,'Over travel'],
  [181,4,'CDP X'],[185,4,'CDP Y'],[189,4,'Inline number'],[193,4,'Crossline number'],[197,4,'Shotpoint number'],[201,2,'Shotpoint scalar'],

function inspectTrace(t) {
  const seg = S.seg; if (!seg) return;
  t = clamp(Math.round(t) || 1, 1, seg.n); S.inspect = t; $('trInput').value = t;
  const i = t - 1, rows = [];
  if (!seg.raw) { fillTable($('trTable').tBodies[0], [['Trace headers', 'Not kept in memory for this very large file']]); return; }
  const dv = new DataView(seg.raw.buffer, i * 240, 240), le = seg.L.le, hideZero = $('hideZero').checked, nav = S.nav;
  rows.push(['Derived', '', 'grp']);
  if (isNum(nav.lat[i])) rows.push(['Latitude / longitude', `${nav.lat[i].toFixed(7)}°, ${nav.lon[i].toFixed(7)}°`]);
  if (isNum(nav.E[i])) rows.push([`UTM ${nav.zone}${nav.south ? 'S' : 'N'} E / N`, `${nav.E[i].toFixed(2)}, ${nav.N[i].toFixed(2)}`]);
  if (seg.H.hasTime) rows.push(['UTC time', fmtUTC(seg.H.tsec[i])]);

$('trPrev').addEventListener('click', () => { inspectTrace(S.inspect - 1); jumpToTrace(S.inspect - 1); });

$('hideZero').addEventListener('change', () => inspectTrace(S.inspect));

function fillHeaders() {
  const seg = S.seg, b = seg.L.bin;
  $('textHeader').textContent = seg.L.textHeader.text; $('textEnc').textContent = `(${seg.L.textHeader.encoding}${seg.L.nExt ? ` + ${seg.L.nExt} extended` : ''})`;
  fillTable($('binTable').tBodies[0], [
    ['Binary header', '', 'grp'],

    ['3213–3214 Data traces / ensemble', b.ntrPerEns], ['3215–3216 Aux traces / ensemble', b.auxPerEns],
    ['3217–3218 Sample interval (µs)', b.dt], ['3219–3220 Original interval (µs)', b.dtOrig], ['3221–3222 Samples / trace', b.ns],
    ['3223–3224 Original samples', b.nsOrig], ['3225–3226 Format code', `${b.fmt} (${FORMATS[b.fmt] ? FORMATS[b.fmt].name : 'unknown'})`],
    ['3227–3228 Ensemble fold', b.fold], ['3229–3230 Sorting code', b.sortCode], ['3255–3256 Measurement system', `${b.measSys} (${b.measSys === 1 ? 'metres' : b.measSys === 2 ? 'feet' : 'unset'})`],

}
function fillQC() {
  const seg = S.seg; if (!seg) return;
  const L = seg.L, nav = S.nav, H = seg.H, recMs = seg.maxNs * L.dtUs / 1000;
  const dv0 = seg.raw ? new DataView(seg.raw.buffer, 0, 240) : null, i16 = (b) => dv0 ? dv0.getInt16(b - 1, L.le) : 0;
  const rows = [
    ['File', '', 'grp'],
    ['Name', S.file.name], ['Size', fmtBytes(seg.fileSize)],
    ['SEG-Y revision / byte order', `${L.bin.revMajor}.${L.bin.revMinor} · ${L.le ? 'little' : 'big'}-endian`],
    ['Sample format', `${L.fmt} – ${FORMATS[L.fmt].name}`],
    ['Traces', `${seg.n.toLocaleString()}${seg.step > 1 ? ` (1/${seg.step} displayed)` : ''}`],
    ['Samples / interval', `${seg.maxNs.toLocaleString()} × ${(L.dtUs).toLocaleString()} µs (${(1e6 / L.dtUs / 1000).toFixed(1)} kHz, ${L.dtSource})`],
    ['Record length', `${recMs.toFixed(2)} ms  ≈ ${twt2depth(recMs).toFixed(1)} m @ ${vel()} m/s`, ''],
    ['Data after last non-zero sample', seg.lastRow + 1 < seg.maxNs ? `${((seg.maxNs - seg.lastRow - 1) * L.dtUs / 1000).toFixed(2)} ms of zero padding (hidden)` : 'none'],

  ];

    ['Position source', `${nav.src} X/Y (${nav.units.join(', ') || 'none'})`],
    ['Coordinate system', nav.geographic ? `WGS 84 geographic → UTM ${nav.zone}${nav.south ? 'S' : 'N'} (${nav.zoneHow})` : `WGS 84 / UTM ${nav.zone}${nav.south ? 'S' : 'N'} (${nav.zoneHow})`],
    ['Nav dropouts', nav.zero.toLocaleString(), nav.zero ? 'warn' : 'ok'],
    ['Line length', `${fmtFix(nav.total, 1)} m`],
    ['Median ping spacing', isNum(nav.medSpacing) ? `${nav.medSpacing.toFixed(3)} m` : '–'],
    ['Position jumps (>10× median)', nav.jumps.length.toLocaleString(), nav.jumps.length ? 'warn' : 'ok'],

    ['Ping rate', isNum(nav.pingRate) ? `${nav.pingRate.toFixed(2)} Hz` : '–'], ['Mean speed', isNum(nav.speedKn) ? `${nav.speedKn.toFixed(2)} kn` : '–', isNum(nav.speedKn) && nav.speedKn < 0.3 ? 'warn' : '']);

document.querySelectorAll('.tab').forEach((b) => b.addEventListener('click', () => showTab(b.dataset.tab)));

$('pngBtn').addEventListener('click', () => {

// If a provider stops delivering tiles, jump to the *other* provider (all Esri maps share one server)

let basemapKey = null, basemapGroup = L.layerGroup().addTo(map), tileStats = { ok: 0, err: 0 }, tileWatch = null;

let datasets = [];
let idSeq = 0;

function computeStats(arr) {
  let min = Infinity, max = -Infinity;

  const sample = new Float32Array(Math.ceil(n / step)); let k = 0;

  const q = p => k ? s[Math.min(k - 1, Math.floor(p * (k - 1)))] : NaN;

}
function getRange(ds) {
  const mm = $('stretch').value === 'minmax';
  const pick = s => mm ? [s.min, s.max] : [s.p2, s.p98];
  if ($('link-range').checked) {
    let lo = Infinity, hi = -Infinity;
    datasets.filter(d => d.visible).forEach(d => { const r = pick(d.stats); lo = Math.min(lo, r[0]); hi = Math.max(hi, r[1]); });
    if (isFinite(lo) && isFinite(hi)) return [lo, hi];

}
function toFloatGrid(raw, nd) {

}

// Reproject a dataset's native grid onto a Web-Mercator-aligned grid (what Leaflet actually draws)
function buildWarp(ds) {
  const g = ds.grid;

  const x0 = g.originX, x1 = g.originX + g.width * g.resX;

      minLat = Math.min(minLat, q[1]); maxLat = Math.max(maxLat, q[1]);

  }
  if (minLat > maxLat) throw new Error('Coordinates could not be transformed — check the layer CRS.');
  ds.llBounds = L.latLngBounds([minLat, minLng], [maxLat, maxLng]);

  const merc = conv('EPSG:4326', 'EPSG:3857');
  const m0 = merc.forward([minLng, minLat]), m1 = merc.forward([maxLng, maxLat]);

  const S = 8, cw = Math.floor(W / S) + 2, ch = Math.floor(H / S) + 2;

    const p = m2d.forward([mx, my]);

    lat[(j * cw + i) * 2 + 1] = (p[1] - g.originY) / g.resY;

  for (let y = 0; y < H; y++) {
    const v = (y + 0.5) / S, j = Math.floor(v), fy = v - j;

      const row = (lat[a + 1] * (1 - fx) + lat[b + 1] * fx) * (1 - fy) + (lat[c + 1] * (1 - fx) + lat[d + 1] * fx) * fy;

}

// Fit a layer into the part of the map not covered by the side panels
function fitToLayer(ds) {

}
function addDataset(ds) {

$('layer-list').addEventListener('click', e => {

/* =====================================================================
   6. FILE LOADERS
   ===================================================================== */
async function handleFiles(files) {
  for (const file of files) {
    const ext = file.name.split('.').pop().toLowerCase();
    await withLoading(`Reading ${file.name}…`, async () => {
      if (ext === 'tif' || ext === 'tiff') await loadGeoTIFF(file);
      else if (ext === 'las') await loadLAS(file);
      else if (ext === 'laz') throw new Error('LAZ (compressed) is not supported in the browser build — convert to LAS with PDAL/LAStools/CloudCompare.');
      else if (['csv', 'xyz', 'txt', 'pts'].includes(ext)) await loadASCII(file);
      else throw new Error(`Unsupported file type: .${ext}`);
    });
  }
}
$('file-input').addEventListener('change', async e => { await handleFiles([...e.target.files]); e.target.value = ''; });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) handleFiles([...e.dataTransfer.files]); });

async function loadGeoTIFF(file) {
  const tiff = await GeoTIFF.fromBlob(file);
  const image = await tiff.getImage();
  const W = image.getWidth(), H = image.getHeight();
  let outW = W, outH = H;
  const opts = { samples: [0], interleave: true };
  if (W * H > MAX_RASTER_PIXELS) {
    const f = Math.sqrt(MAX_RASTER_PIXELS / (W * H));
    outW = Math.max(1, Math.floor(W * f)); outH = Math.max(1, Math.floor(H * f));
    Object.assign(opts, { width: outW, height: outH, resampleMethod: 'nearest' });
  }
  const raw = await image.readRasters(opts);
  const res = image.getResolution();
  const origin = image.getOrigin().slice();
  const gk0 = image.geoKeys || (image.getGeoKeys ? image.getGeoKeys() : null) || {};
  if (gk0.GTRasterTypeGeoKey === 2) { origin[0] -= res[0] / 2; origin[1] -= res[1] / 2; }   // PixelIsPoint: tie point is the pixel centre
  const resX = res[0] * W / outW, resY = res[1] * H / outH;

  let nd = null;
  try { nd = image.getGDALNoData(); } catch (_) {}
  if (nd == null) { const s = image.getFileDirectory().GDAL_NODATA; if (s) nd = parseFloat(s); }
  const data = toFloatGrid(raw, nd);

  let crs = null, how = '';
  const sel = $('input-crs').value;
  if (sel !== 'auto') { crs = sel; how = 'user-selected'; }
  else {
    const gk = image.geoKeys || (image.getGeoKeys ? image.getGeoKeys() : null) || {};
    const pc = gk.ProjectedCSTypeGeoKey, gc = gk.GeographicTypeGeoKey;
    if (pc && pc !== 32767) {
      const code = 'EPSG:' + pc;
      if (ensureCRS(code)) { crs = code; how = 'from GeoTIFF tags'; }
      else toast(`${code} is not in the built-in list — falling back to auto-detection.`, 'warn', 8000);
    } else if (gc && gc !== 32767) { crs = gc === 4240 ? 'EPSG:4240' : 'EPSG:4326'; how = 'from GeoTIFF tags'; }
  }
  if (!crs) {
    crs = guessCRS(origin[0] + resX * outW / 2, origin[1] + resY * outH / 2);
    how = crs.startsWith('EPSG:32') ? 'assumed' : 'detected from coordinate range';
  }
  const unit = CRS[crs] && CRS[crs].group === 'Geographic' ? '°' : ' m';
  addDataset({
    type: 'raster', name: file.name, crs, crsHow: how,
    grid: { data, width: outW, height: outH, originX: origin[0], originY: origin[1], resX, resY },
    stats: computeStats(data),
    info: `${W}×${H}${outW !== W ? ` (read ${outW}×${outH})` : ''} · ${Math.abs(resX).toPrecision(3)}${unit}/px`
  });
}

async function loadASCII(file) {
  const text = await file.text();
  const lines = text.split(/\r?\n/);
  let ix = 0, iy = 1, iz = 2, ir = -1, ig = -1, ib = -1, ii = -1, ic = -1, start = 0, cols = 0;
  // header / first data line
  for (; start < lines.length; start++) {
    const l = lines[start].trim();
    if (!l || l.startsWith('#') || l.startsWith('//')) continue;
    const t = l.split(/[\s,;]+/);
    if (t.length < 3) continue;
    if (t.slice(0, 3).some(s => isNaN(parseFloat(s)))) {
      const names = t.map(s => s.toLowerCase().replace(/["']/g, '').replace(/^\/\//, ''));
      const find = (...keys) => names.findIndex(nm => keys.includes(nm));
      const fx = find('x', 'e', 'east', 'easting', 'lon', 'long', 'longitude', 'lng'), fy = find('y', 'n', 'north', 'northing', 'lat', 'latitude'), fz = find('z', 'h', 'elev', 'elevation', 'height', 'alt', 'altitude');
      if (fx >= 0) ix = fx; if (fy >= 0) iy = fy; if (fz >= 0) iz = fz;
      ir = find('r', 'red'); ig = find('g', 'green'); ib = find('b', 'blue'); ii = find('i', 'intensity'); ic = find('c', 'class', 'classification');
      start++; break;
    }
    cols = t.length;
    if (cols === 4) ii = 3; else if (cols === 6) { ir = 3; ig = 4; ib = 5; } else if (cols >= 7) { ii = 3; ir = 4; ig = 5; ib = 6; }
    break;
  }
  const total = lines.length - start;
  const stride = Math.max(1, Math.ceil(total / MAX_STORED_POINTS));
  const cap = Math.ceil(total / stride) + 1;
  const x = new Float64Array(cap), y = new Float64Array(cap), z = new Float32Array(cap);
  const hasRGB = ir >= 0 && ig >= 0 && ib >= 0;
  const rgb = hasRGB ? new Float32Array(cap * 3) : null, inten = ii >= 0 ? new Float32Array(cap) : null, cls = ic >= 0 ? new Uint8Array(cap) : null;
  let k = 0, rgbMax = 0;
  for (let i = start; i < lines.length; i += stride) {
    const l = lines[i]; if (!l) continue;
    const t = l.trim().split(/[\s,;]+/);
    if (t.length < 3) continue;
    const X = parseFloat(t[ix]), Y = parseFloat(t[iy]), Z = parseFloat(t[iz]);
    if (!isFinite(X) || !isFinite(Y) || !isFinite(Z)) continue;
    x[k] = X; y[k] = Y; z[k] = Z;
    if (rgb) for (let c = 0; c < 3; c++) { const v = Math.max(0, parseFloat(t[[ir, ig, ib][c]]) || 0); rgb[k * 3 + c] = v; if (v > rgbMax) rgbMax = v; }
    if (inten) inten[k] = parseFloat(t[ii]) || 0;
    if (cls) cls[k] = parseInt(t[ic]) || 0;
    k++;

  if (!k) throw new Error('No valid X, Y, Z rows found.');
  if (stride > 1) toast(`Large file — kept every ${stride}th point (${k.toLocaleString()}).`, 'warn', 7000);
  const sel = $('input-crs').value;
  finalizePoints(file.name, {
    x: x.subarray(0, k), y: y.subarray(0, k), z: z.subarray(0, k), count: k,
    rgb: rgb && rgbMax > 0 ? rgb.subarray(0, k * 3) : null, rgbMax: rgbMax > 255 ? 65535 : rgbMax > 1 ? 255 : 1,
    intensity: inten ? inten.subarray(0, k) : null, cls: cls ? cls.subarray(0, k) : null
  }, sel !== 'auto' ? sel : null, sel !== 'auto' ? 'user-selected' : '', file.name.split('.').pop().toUpperCase());
}

function finalizePoints(name, P, crs, how, label) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < P.count; i++) {
    const X = P.x[i], Y = P.y[i];

  }
  if (!crs) { crs = guessCRS((minX + maxX) / 2, (minY + maxY) / 2); how = crs.startsWith('EPSG:32') ? 'assumed' : 'detected from coordinate range'; }

  const zs = new Float32Array(P.count);
  for (let i = 0; i < P.count; i++) { const v = P.z[i]; zs[i] = (v < VMIN || v > VMAX) ? NaN : v; }
  P.z = zs;
  if (P.intensity) P.iStats = computeStats(P.intensity);

  // Grid the cloud for the 2D overlay / profile / surface (max-Z per cell, then small hole fill)
  const dx = Math.max(maxX - minX, 1e-9), dy = Math.max(maxY - minY, 1e-9);
  const base = Math.max(64, Math.min(1200, Math.round(Math.sqrt(P.count) * 0.8)));
  let w, h; if (dx >= dy) { w = base; h = Math.max(2, Math.round(base * dy / dx)); } else { h = base; w = Math.max(2, Math.round(base * dx / dy)); }
  const resX = dx / w, resY = -dy / h;
  const tmp = new Float32Array(w * h).fill(NaN);
  for (let i = 0; i < P.count; i++) {
    const v = P.z[i]; if (v !== v) continue;
    const c = Math.min(w - 1, Math.floor((P.x[i] - minX) / resX)), r = Math.min(h - 1, Math.floor((maxY - P.y[i]) / -resY));
    const idx = r * w + c; if (!(tmp[idx] >= v)) tmp[idx] = v;
  }
  const grid = new Float32Array(tmp); const R = 2;
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const idx = r * w + c; if (tmp[idx] === tmp[idx]) continue;
    let best = NaN;
    for (let dr = -R; dr <= R; dr++) for (let dc = -R; dc <= R; dc++) {
      const rr = r + dr, cc = c + dc; if (rr < 0 || rr >= h || cc < 0 || cc >= w || dr * dr + dc * dc > R * R) continue;
      const v = tmp[rr * w + cc]; if (v === v && !(best >= v)) best = v;
    }
    grid[idx] = best;
  }
  const extras = [P.rgb ? 'RGB' : '', P.intensity ? 'I' : '', P.cls ? 'class' : ''].filter(Boolean).join('+');
  addDataset({
    type: 'points', name, crs, crsHow: how, points: P,
    grid: { data: grid, width: w, height: h, originX: minX, originY: maxY, resX, resY },
    stats: computeStats(P.z),
    info: `${P.count.toLocaleString()} pts · ${label}${extras ? ' · ' + extras : ''}`
  });
}

function growBB(bb, x, y, z) {
  if (x < bb.minX) bb.minX = x; if (x > bb.maxX) bb.maxX = x;
  if (y < bb.minY) bb.minY = y; if (y > bb.maxY) bb.maxY = y;
  if (z < bb.minZ) bb.minZ = z; if (z > bb.maxZ) bb.maxZ = z;
}
function mergeBB(a, b) { ['X', 'Y', 'Z'].forEach(k => { a['min' + k] = Math.min(a['min' + k], b['min' + k]); a['max' + k] = Math.max(a['max' + k], b['max' + k]); }); }

// Local frame: x = Easting − cx, y = Z − zRef (scaled by exaggeration on the group), z = −(Northing − cy)
function buildPoints(ds, budget, colorBy) {
  const f = conv(ds.crs, frame.crs), lut = getLUT();
  const [lo, hi] = getRange(ds), span = (hi - lo) || 1;
  const bb = newBB();
  let pos, col, k = 0;
  const P = ds.points;
  let mode = colorBy;
  if (ds.type !== 'points' || (mode === 'rgb' && !P.rgb) || (mode === 'intensity' && !P.intensity) || (mode === 'class' && !P.cls)) mode = 'elev';

  const put = (e, n, z, r, g, b) => {
    const y = z - frame.zRef;
    pos[k * 3] = e; pos[k * 3 + 1] = y; pos[k * 3 + 2] = -n;
    col[k * 3] = r; col[k * 3 + 1] = g; col[k * 3 + 2] = b;
    growBB(bb, e, y, -n); k++;
  };
  if (ds.type === 'points') {
    const step = Math.max(1, Math.ceil(P.count / budget)), cap = Math.ceil(P.count / step);
    pos = new Float32Array(cap * 3); col = new Float32Array(cap * 3);
    const iLo = P.iStats ? P.iStats.p2 : 0, iSpan = P.iStats ? ((P.iStats.p98 - P.iStats.p2) || 1) : 1;
    for (let i = 0; i < P.count; i += step) {
      const z = P.z[i]; if (z !== z) continue;
      const q = f.forward([P.x[i], P.y[i]]);
      const e = q[0] - frame.cx, n = q[1] - frame.cy;
      if (frame.area && !inArea(e, n)) continue;
      if (mode === 'rgb') put(e, n, z, P.rgb[i * 3] / P.rgbMax, P.rgb[i * 3 + 1] / P.rgbMax, P.rgb[i * 3 + 2] / P.rgbMax);
      else if (mode === 'intensity') { let t = (P.intensity[i] - iLo) / iSpan; t = t < 0 ? 0 : t > 1 ? 1 : t; t = 0.1 + 0.9 * t; put(e, n, z, t, t, t); }
      else if (mode === 'class') { const c = CLASS_RGB[P.cls[i]] || CLASS_RGB[1]; put(e, n, z, c[0], c[1], c[2]); }
      else { const li = lutIndex(z, lo, span); put(e, n, z, lut[li] / 255, lut[li + 1] / 255, lut[li + 2] / 255); }
    }
  } else {
    const g = ds.grid, step = Math.max(1, Math.ceil(Math.sqrt(g.width * g.height / budget)));
    const cap = Math.ceil(g.width / step) * Math.ceil(g.height / step);
    pos = new Float32Array(cap * 3); col = new Float32Array(cap * 3);
    for (let r = 0; r < g.height; r += step) for (let c = 0; c < g.width; c += step) {
      const v = g.data[r * g.width + c]; if (v !== v) continue;
      const q = f.forward([g.originX + (c + 0.5) * g.resX, g.originY + (r + 0.5) * g.resY]);
      const e = q[0] - frame.cx, n = q[1] - frame.cy;
      if (frame.area && !inArea(e, n)) continue;
      const li = lutIndex(v, lo, span); put(e, n, v, lut[li] / 255, lut[li + 1] / 255, lut[li + 2] / 255);
    }
  }
  if (!k) return null;
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(pos.subarray(0, k * 3), 3));
  geom.setAttribute('aColor', new THREE.BufferAttribute(col.subarray(0, k * 3), 3));
  const spacing = Math.sqrt(Math.max((bb.maxX - bb.minX) * (bb.maxZ - bb.minZ), 1e-6) / k) || 1;
  const mat = new THREE.ShaderMaterial({
    uniforms: { uSize: { value: 2 }, uScale: { value: 1 }, uAtten: { value: true }, uShade: { value: true } },
    vertexShader: POINT_VS, fragmentShader: POINT_FS
  });
  mat.userData.spacing = spacing;
  const obj = new THREE.Points(geom, mat);
  obj.userData.ds = ds.name;
  return { obj, count: k, bb };
}

function buildSurface(ds, budget) {
  const g = ds.grid, f = conv(ds.crs, frame.crs), lut = getLUT();
  const [lo, hi] = getRange(ds), span = (hi - lo) || 1;
  const step = Math.max(1, Math.ceil(Math.sqrt(g.width * g.height / budget)));
  const nx = Math.ceil(g.width / step), ny = Math.ceil(g.height / step);
  const pos = new Float32Array(nx * ny * 3), col = new Float32Array(nx * ny * 3), valid = new Uint8Array(nx * ny);
  const bb = newBB(); let nValid = 0;
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const r = Math.min(j * step, g.height - 1), c = Math.min(i * step, g.width - 1), idx = j * nx + i;
    const v = g.data[r * g.width + c];
    const q = f.forward([g.originX + (c + 0.5) * g.resX, g.originY + (r + 0.5) * g.resY]);
    const e = q[0] - frame.cx, n = q[1] - frame.cy;
    const ok = v === v && inArea(e, n);
    const y = ok ? v - frame.zRef : 0;
    pos[idx * 3] = e; pos[idx * 3 + 1] = y; pos[idx * 3 + 2] = -n;
    if (ok) {
      valid[idx] = 1; nValid++; growBB(bb, e, y, -n);
      const li = lutIndex(v, lo, span); col[idx * 3] = lut[li] / 255; col[idx * 3 + 1] = lut[li + 1] / 255; col[idx * 3 + 2] = lut[li + 2] / 255;
    }
  }
  if (!nValid) return null;
  const index = new Uint32Array(Math.max(0, (nx - 1) * (ny - 1) * 6)); let t = 0;
  for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
    const a = j * nx + i, b = a + 1, c = a + nx, d = c + 1;
    if (valid[a] && valid[b] && valid[c] && valid[d]) { index[t++] = a; index[t++] = c; index[t++] = b; index[t++] = b; index[t++] = c; index[t++] = d; }
  }
  if (!t) return null;
  const geom = new THREE.BufferGeometry();
  geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geom.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geom.setIndex(new THREE.BufferAttribute(index.subarray(0, t), 1));
  geom.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide });
  const obj = new THREE.Mesh(geom, mat);
  obj.userData.ds = ds.name;
  return { obj, count: nValid, bb };
}

function build3D() {
  disposeGroup(dataGroup); disposeGroup(helperGroup);
  pickMarker.visible = false; $('r3-pick').innerText = 'Click a point to read its coordinates'; clearPickPin();
  const empty = $('r3-empty');
  const vis = datasets.filter(d => d.visible);
  if (!vis.length) { frame = null; empty.innerText = 'Load a layer (or make one visible) to view it in 3D.'; empty.classList.remove('is-hidden'); $('r3-stats').innerText = '–'; $('r3-crs').innerText = ''; return; }
  frame = computeFrame(vis);
  const mode = $('r3-mode').value, colorBy = $('r3-color').value;
  const perLayer = Math.max(20000, Math.floor(+$('r3-budget').value / vis.length));
  const bb = newBB(); let total = 0, nSurf = 0;
  vis.forEach(ds => {
    const surface = mode === 'surface' || (mode === 'auto' && ds.type === 'raster');
    const res = surface ? buildSurface(ds, Math.min(perLayer, 1500000)) : buildPoints(ds, perLayer, colorBy);
    if (!res) return;
    dataGroup.add(res.obj); total += res.count; mergeBB(bb, res.bb); if (surface) nSurf++;
  });
  if (!isFinite(bb.minX)) { frame.bb = null; empty.innerText = 'No data inside the selected area.'; empty.classList.remove('is-hidden'); $('r3-stats').innerText = '–'; $('r3-crs').innerText = ''; return; }
  empty.classList.add('is-hidden');
  frame.bb = bb; frame.total = total; frame.nSurf = nSurf;
  if (!exagTouched) {
    const horiz = Math.max(bb.maxX - bb.minX, bb.maxZ - bb.minZ), relief = Math.max(bb.maxY - bb.minY, 1e-3);
    const e = Math.min(10, Math.max(1, Math.round(0.15 * horiz / relief * 2) / 2));
    $('r3-exag').value = e;
  }
  $('r3-crs').innerText = CRS[frame.crs].name.replace('WGS 84 / ', '') + (areaBounds ? ' · area filter' : '');
  applyExag(false);
  updatePointUniforms();
  fitCamera('iso');
  updateStatsLine();
}
function updateStatsLine() {
  if (!frame || !frame.bb || frame.total == null) return;
  const bb = frame.bb;
  $('r3-stats').innerText = `${frame.total.toLocaleString()} ${frame.nSurf ? 'vertices/points' : 'points'} · ${fmtDist(bb.maxX - bb.minX)} × ${fmtDist(bb.maxZ - bb.minZ)} · Z ${fmtNum(bb.minY + frame.zRef, 1)}–${fmtNum(bb.maxY + frame.zRef, 1)} m · grid ${frame.gridStep ? fmtDist(frame.gridStep) : '–'}`;
}

function textSprite(text, color = '#e5e7eb', h = 0.035) {
  const c = document.createElement('canvas'), ctx = c.getContext('2d'), fs = 44;
  ctx.font = `600 ${fs}px Inter, sans-serif`;
  c.width = Math.ceil(ctx.measureText(text).width) + 28; c.height = fs + 22;
  ctx.fillStyle = 'rgba(15,17,21,0.78)'; ctx.fillRect(0, 0, c.width, c.height);
  ctx.font = `600 ${fs}px Inter, sans-serif`; ctx.fillStyle = color; ctx.textBaseline = 'middle'; ctx.fillText(text, 14, c.height / 2 + 2);
  const tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true, sizeAttenuation: false }));
  s.scale.set(h * c.width / c.height, h, 1); s.renderOrder = 15;
  return s;
}
function buildHelpers() {
  disposeGroup(helperGroup);
  if (!frame || !frame.bb) return;
  const bb = frame.bb, e = exag() * zSign();
  // world-space bottom (y0) and top (y1) of the data; when flipped, the highest Z ends up at the bottom
  const y0 = Math.min(bb.minY * e, bb.maxY * e), y1 = Math.max(bb.minY * e, bb.maxY * e);
  const zTopVal = (zFlip ? bb.minY : bb.maxY) + frame.zRef, zBotVal = (zFlip ? bb.maxY : bb.minY) + frame.zRef;
  const w = bb.maxX - bb.minX, d = bb.maxZ - bb.minZ, size = Math.max(w, d, 1e-3);
  frame.gridStep = niceStep(size / 10);
  if (!$('r3-grid').checked) { updateStatsLine(); return; }

  const box = new THREE.Box3Helper(new THREE.Box3(new THREE.Vector3(bb.minX, y0, bb.minZ), new THREE.Vector3(bb.maxX, Math.max(y1, y0 + 1e-3), bb.maxZ)), 0x60a5fa);
  box.material.transparent = true; box.material.opacity = 0.35; helperGroup.add(box);

  const n = Math.ceil(size / frame.gridStep) + 1, gsize = n * frame.gridStep;
  const grid = new THREE.GridHelper(gsize, n, 0x64748b, 0x334155);
  grid.material.transparent = true; grid.material.opacity = 0.55;
  grid.position.set((bb.minX + bb.maxX) / 2, y0 - size * 0.002, (bb.minZ + bb.maxZ) / 2);
  helperGroup.add(grid);

  const len = size * 0.1, base = new THREE.Vector3(bb.maxX + size * 0.06, y0, bb.minZ + len);
  helperGroup.add(new THREE.ArrowHelper(new THREE.Vector3(0, 0, -1), base, len, 0xef4444, len * 0.35, len * 0.22));
  const nl = textSprite('N', '#fca5a5'); nl.position.set(base.x, y0, base.z - len * 1.35); helperGroup.add(nl);

  const zt = textSprite(`${fmtNum(zTopVal, 1)} m`, '#e5e7eb'); zt.center.set(0, 0.5); zt.position.set(bb.maxX, y1, bb.maxZ); helperGroup.add(zt);
  const zb = textSprite(`${fmtNum(zBotVal, 1)} m`, '#9ca3af'); zb.center.set(0, 0.5); zb.position.set(bb.maxX, y0, bb.maxZ); helperGroup.add(zb);
  const wl = textSprite(fmtDist(w), '#93c5fd'); wl.position.set((bb.minX + bb.maxX) / 2, y0, bb.maxZ + size * 0.03); helperGroup.add(wl);
  updateStatsLine();
}
function applyExag(markTouched) {
  if (markTouched) exagTouched = true;
  $('r3-exag-val').innerText = '×' + exag();
  dataGroup.scale.y = exag() * zSign();
  pickMarker.visible = false;
  buildHelpers();
}
function updatePointUniforms() {
  const s = +$('r3-size').value, atten = $('r3-atten').checked, shade = $('r3-shade').checked;
  $('r3-size-val').innerText = s;
  const scale = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));
  dataGroup.children.forEach(o => {
    if (!o.isPoints) return;
    const u = o.material.uniforms;
    u.uAtten.value = atten; u.uShade.value = shade; u.uScale.value = scale;
    u.uSize.value = atten ? o.material.userData.spacing * s * 0.6 : s * renderer.getPixelRatio();
  });
}
function fitCamera(view) {
  if (!frame || !frame.bb) return;
  const bb = frame.bb, e = exag();
  const c = new THREE.Vector3((bb.minX + bb.maxX) / 2, (bb.minY + bb.maxY) / 2 * e * zSign(), (bb.minZ + bb.maxZ) / 2);
  const size = Math.max(bb.maxX - bb.minX, bb.maxZ - bb.minZ, (bb.maxY - bb.minY) * e, 1e-3);
  const dist = size / (2 * Math.tan(camera.fov * Math.PI / 360)) * 1.2;
  const off = view === 'top' ? new THREE.Vector3(0, dist, dist * 0.001) : new THREE.Vector3(dist * 0.3, dist * 0.55, dist * 0.8).setLength(dist);
  camera.position.copy(c).add(off);
  camera.near = Math.max(dist / 5000, 0.01); camera.far = dist * 60;
  camera.updateProjectionMatrix();
  controls.target.copy(c); controls.update();
  updatePointUniforms();
}

// Picking: click (without drag) on a point or surface
let downXY = null;
renderer.domElement.addEventListener('pointerdown', e => { downXY = [e.clientX, e.clientY]; controls.autoRotate = false; $('r3-rotate').classList.remove('active'); });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downXY) return;
  const moved = Math.hypot(e.clientX - downXY[0], e.clientY - downXY[1]); downXY = null;
  if (moved > 4 || !frame || !frame.bb) return;
  const rect = renderer.domElement.getBoundingClientRect();
  raycaster.setFromCamera(new THREE.Vector2((e.clientX - rect.left) / rect.width * 2 - 1, -(e.clientY - rect.top) / rect.height * 2 + 1), camera);
  const bb = frame.bb, size = Math.max(bb.maxX - bb.minX, bb.maxZ - bb.minZ);
  raycaster.params.Points.threshold = size / 400;
  const hits = raycaster.intersectObjects(dataGroup.children, false);
  if (!hits.length) return;
  const h = hits[0];
  let lp;
  if (h.object.isPoints) { const a = h.object.geometry.attributes.position; lp = new THREE.Vector3(a.getX(h.index), a.getY(h.index), a.getZ(h.index)); }
  else lp = dataGroup.worldToLocal(h.point.clone());
  const wp = dataGroup.localToWorld(lp.clone());
  pickMarker.position.copy(wp); pickMarker.scale.setScalar(size / 250); pickMarker.visible = true;
  const E = lp.x + frame.cx, N = -lp.z + frame.cy, Z = lp.y + frame.zRef;
  const ll = conv(frame.crs, 'EPSG:4326').forward([E, N]);
  $('r3-pick').innerText = `E ${fmtNum(E)}  N ${fmtNum(N)}  Z ${fmtNum(Z)} m  ·  ${ll[1].toFixed(6)}°, ${ll[0].toFixed(6)}°  ·  ${h.object.userData.ds}`;
  if (pickPin) pickPin.setLatLng([ll[1], ll[0]]);
  else pickPin = L.circleMarker([ll[1], ll[0]], { radius: 6, color: '#000', weight: 1.5, fillColor: '#facc15', fillOpacity: 1 }).addTo(map);
});

// 3D controls wiring
['r3-mode', 'r3-color', 'r3-budget'].forEach(id => $(id).addEventListener('change', schedule3D));
$('r3-exag').addEventListener('input', () => applyExag(true));
['r3-size', 'r3-atten', 'r3-shade'].forEach(id => $(id).addEventListener('input', updatePointUniforms));
$('r3-grid').addEventListener('change', buildHelpers);
$('r3-top').addEventListener('click', () => fitCamera('top'));
$('r3-iso').addEventListener('click', () => fitCamera('iso'));
$('r3-flip').addEventListener('click', e => {
  zFlip = !zFlip;
  e.currentTarget.classList.toggle('active', zFlip);
  if (!frame || !frame.bb) return;
  const oldTarget = controls.target.clone();
  applyExag(false);                                   // re-scales data, rebuilds box / grid / labels
  const bb = frame.bb, cy = (bb.minY + bb.maxY) / 2 * exag() * zSign();
  const shift = new THREE.Vector3(0, cy - oldTarget.y, 0);   // keep the same viewing angle, re-centre vertically
  camera.position.add(shift); controls.target.add(shift); controls.update();
});
$('r3-rotate').addEventListener('click', e => { controls.autoRotate = !controls.autoRotate; e.currentTarget.classList.toggle('active', controls.autoRotate); });
$('r3-shot').addEventListener('click', () => {
  renderer.render(scene, camera);
  const src = renderer.domElement, c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const ctx = c.getContext('2d'), g = ctx.createLinearGradient(0, 0, 0, c.height);
  g.addColorStop(0, '#1b2433'); g.addColorStop(1, '#0b0e13');
  ctx.fillStyle = g; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(src, 0, 0);
  download(c.toDataURL('image/png'), 'scene_3d.png');
});

new ResizeObserver(entries => {
  for (const en of entries) {
    const { width, height } = en.contentRect;
    if (width > 0 && height > 0) { camera.aspect = width / height; camera.updateProjectionMatrix(); renderer.setSize(width, height, false); renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%'; updatePointUniforms(); }
  }
}).observe(threeContainer);

(function animate() {
  requestAnimationFrame(animate);
  if (!is3DOpen()) return;
  controls.update();
  renderer.render(scene, camera);
})();

/* =====================================================================
   9. GLOBAL SETTINGS WIRING
   ===================================================================== */
$('opacity-slider').addEventListener('input', e => {
  const v = +e.target.value; $('opacity-val').innerText = Math.round(v * 100) + '%';
  datasets.forEach(ds => ds.overlayLayer && ds.overlayLayer.setOpacity(v));
});
['color-map', 'stretch', 'link-range'].forEach(id => $(id).addEventListener('change', () => {
  withLoading('Updating colors…', async () => { refreshOverlays(); if (is3DOpen()) build3D(); });
}));
window.addEventListener('resize', () => map.invalidateSize());

refreshInputCrsOptions();
updateLayerList();
updateLegend();
<\/script>
</body>

<script>
(function(){
"use strict";
var TOOLS = [
  {id:"sss",   label:"Side Scan Planner",     title:"Side Scan Run-line Planner"},
  {id:"mbes",  label:"Multibeam Planner",     title:"Multibeam Run-line Planner"},
  {id:"sbp",   label:"SBP Quick View",        title:"Sub-Bottom Profiler SEG-Y Quick View"},
  {id:"cloud", label:"Point Cloud Dashboard", title:"Point Cloud Geospatial Dashboard"}
];
var KEY = "seabed-toolkit-tool", stage = document.getElementById("stage"), sw = document.getElementById("switch");
var frames = {}, buttons = {}, current = null;

function source(id){
  // undo the "<\" escaping that keeps the embedded pages from closing their own source block
  return document.getElementById("src-" + id).textContent.replace(/^\s+/, "").replace(/<\\(!--|\/?script)/gi, "<$1");
}
function show(id, focus){
  var tool = TOOLS.filter(function(t){ return t.id === id; })[0] || TOOLS[0];
  id = tool.id;
  if (current === id) return;
  current = id;
  TOOLS.forEach(function(t){
    var on = t.id === id;
    buttons[t.id].setAttribute("aria-selected", on ? "true" : "false");
    buttons[t.id].tabIndex = on ? 0 : -1;
    if (frames[t.id]) frames[t.id].hidden = !on;
  });
  if (!frames[id]){
    try {
      var f = document.createElement("iframe");
      f.title = tool.title; f.id = "frame-" + id; f.setAttribute("role", "tabpanel");
      f.srcdoc = source(id);
      stage.appendChild(f); frames[id] = f;
    } catch (e) {
      var d = document.createElement("div"); d.className = "fail"; d.textContent = "This tool could not be opened: " + e.message; stage.appendChild(d);
    }
  } else {
    // maps, charts and the 3D canvas measured a hidden frame as 0 x 0: let the tool re-measure
    try { frames[id].contentWindow.dispatchEvent(new Event("resize")); } catch (e) {}
  }
  document.title = tool.title + " · Seabed Survey Toolkit";
  try { localStorage.setItem(KEY, id); } catch (e) {}
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  if (focus) buttons[id].focus();
}

TOOLS.forEach(function(t, i){
  var b = document.createElement("button");
  b.type = "button"; b.textContent = t.label; b.title = t.title + " (Alt + " + (i + 1) + ")";
  b.setAttribute("role", "tab"); b.setAttribute("aria-selected", "false"); b.tabIndex = -1;
  b.addEventListener("click", function(){ show(t.id); });
  b.addEventListener("keydown", function(e){
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var n = (i + (e.key === "ArrowRight" ? 1 : TOOLS.length - 1)) % TOOLS.length;
    show(TOOLS[n].id, true); e.preventDefault();
  });
  sw.appendChild(b); buttons[t.id] = b;
});
function hotkey(e){ if (e.altKey && !e.ctrlKey && !e.metaKey && +e.key >= 1 && +e.key <= TOOLS.length) { show(TOOLS[+e.key - 1].id); e.preventDefault(); } }
document.addEventListener("keydown", hotkey);
// a file dropped on the top bar would otherwise replace the whole toolkit with that file
["dragover", "drop"].forEach(function(ev){ document.addEventListener(ev, function(e){ e.preventDefault(); }); });
window.addEventListener("hashchange", function(){ var h = location.hash.slice(1); if (buttons[h]) show(h); });

var first = location.hash.slice(1);
if (!buttons[first]) { try { first = localStorage.getItem(KEY); } catch (e) { first = null; } }
show(buttons[first] ? first : TOOLS[0].id);
})();
</script>
