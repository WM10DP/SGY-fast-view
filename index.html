<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seabed Survey Toolkit</title>
<!--
  Seabed Survey Toolkit: four tools in one file, switched with the buttons in the top bar.
    1. Side Scan Run-line Planner      (source block: src-sss)
    2. Multibeam Run-line Planner      (source block: src-mbes)
    3. Sub-Bottom Profiler Quick View  (source block: src-sbp)
    4. Point Cloud Geospatial Dashboard (source block: src-cloud)
  Each tool is a complete page kept in its own <script type="text/plain"> block at the bottom and is
  loaded into its own frame the first time it is opened. The frames isolate the tools from each other:
  the dashboard uses Tailwind (which resets base styles) and the tools reuse element ids such as
  "model", "speed" and "toast", so they cannot share one document. A frame stays alive once opened,
  so inputs, loaded layers and the 3D scene survive switching.
  To edit a tool, edit its block. Inside the blocks the script tags and comment openers are written with
  a backslash after the "<" so the browser does not end the block early; the loader removes it.
  The loader script is at the very end of the file.
-->
<style>
  :root{color-scheme:dark}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;background:#0f1115;color:#e5e7eb;font:14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  .bar{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:7px 14px;background:#12141a;border-bottom:1px solid #2c313a}
  .brand{font-weight:600;font-size:13px;letter-spacing:.03em;white-space:nowrap}
  .brand span{color:#8b95a1;font-weight:400}
  .switch{display:flex;gap:3px;padding:3px;border-radius:10px;background:#1c2028;border:1px solid #2c313a}
  .switch button{font:500 13px/1.2 inherit;color:#aeb6c0;background:transparent;border:0;border-radius:7px;padding:7px 14px;cursor:pointer;white-space:nowrap}
  .switch button:hover{color:#fff;background:#262b35}
  .switch button[aria-selected="true"]{color:#fff;background:#1F6F8B}
  .switch button:focus-visible{outline:2px solid #7cc4dc;outline-offset:1px}
  .hint{margin-left:auto;font-size:11.5px;color:#8b95a1}
  .stage{flex:1;position:relative;min-height:0}
  .stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f5f7f9}
  .stage iframe[hidden]{display:none}
  .fail{padding:24px;max-width:60ch;color:#fecaca}
  @media (max-width:1150px){.hint{display:none}}
  @media (max-width:760px){.hint{display:none}.switch{width:100%;flex-wrap:wrap}.switch button{flex:1 1 40%;padding:8px 6px;font-size:12px}}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Seabed Survey Toolkit <span>· geophysical planning and data</span></div>
  <div class="switch" role="tablist" aria-label="Tool" id="switch"></div>
  <div class="hint">Each tool keeps its inputs and data while you switch · Alt + 1 to 4</div>
</header>
<main class="stage" id="stage"></main>



<!-- ============================ 1 · SIDE SCAN RUN-LINE PLANNER ============================ -->
<script type="text/plain" id="src-sss">
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Side Scan Run-line Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: short input panel on the left (sticky on desktop), read-outs on the right:
   key numbers -> front view -> tow profile + checks -> plan -> hours + run-lines.
   Single light theme by design: white cards on a pale blue-grey ground, one blue UI accent,
   sand/amber reserved for overlap in the drawings. */
:root{
  --bg:#F5F7F9; --panel:#FFFFFF; --panel-2:#F4F7F9; --ink:#1D2B33; --muted:#6B7880; --line:#E3E8EC;
  --ui:#1F6F8B; --ui-soft:#E8F2F6;
  --accent:#E0962F; --accent-soft:#FBEBD3;
  --seta:#2F5F8F; --setb:#93B9DA; --hf:#2A9D8F; --nadir:#E2574C; --seabed:#E7D8BB; --water:#F0F6FA;
  --ok:#2E8B57; --ok-soft:#E4F4EA; --warn:#A06A00; --warn-soft:#FCF1DA; --bad:#C2413A; --bad-soft:#FBE5E2;
  --fold1:#E2EBF3; --fold2:#A9C5DF; --fold3:#4E7EAD;
  --cable:#C2701C; --lay:#2A66A8;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --radius:12px;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
.wrap{max-width:1480px;margin:0 auto;padding-inline:16px;padding-block:26px 56px}
header.top{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
.eyebrow{font:500 .7rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ui);margin:0 0 6px}
h1{font-weight:600;font-size:clamp(1.6rem,2.4vw,2.15rem);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:60ch;font-size:.93rem}
.btn{font:500 .84rem var(--f-body);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 13px;border-radius:999px;cursor:pointer;line-height:1.2}
.btn:hover{border-color:var(--ui);color:var(--ui)}
.btn.small{padding:3px 10px;font-size:.75rem}
:is(.btn,input,select,summary):focus-visible{outline:2px solid var(--ui);outline-offset:2px}
.app{display:grid;gap:22px;grid-template-columns:minmax(0,1fr)}
@media (min-width:1060px){
  .app{grid-template-columns:300px minmax(0,1fr)}
  .controls{position:sticky;top:calc(env(safe-area-inset-top,0px) + 14px);max-height:calc(100vh - 28px);overflow:auto}
}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:6px 18px 16px;align-self:start}
fieldset{border:0;border-top:1px solid var(--line);margin:0;padding:14px 0 8px;min-width:0}
fieldset:first-of-type{border-top:0}
legend{font:500 .7rem var(--f-mono);letter-spacing:.13em;text-transform:uppercase;color:var(--muted);padding:0;float:left;width:100%;margin-bottom:6px}
legend + *{clear:both}
.f{display:grid;grid-template-columns:minmax(0,1fr) 118px;align-items:center;gap:10px;margin:8px 0}
.f > label{font-size:.86rem;color:var(--ink);line-height:1.25}
.f.full{grid-template-columns:minmax(0,1fr)}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--panel);min-width:0}
.inp:focus-within{border-color:var(--ui);box-shadow:0 0 0 3px var(--ui-soft)}
.inp input,.inp select{width:100%;min-width:0;border:0;background:transparent;color:var(--ink);font:500 .88rem var(--f-mono);padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums}
.inp select{text-align:left;font-family:var(--f-body);font-weight:500;cursor:pointer}
.inp input:focus,.inp select:focus{outline:none}
.inp .u{font:.74rem var(--f-mono);color:var(--muted);padding-right:9px;white-space:nowrap}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel-2);border-radius:9px;padding:3px;gap:3px;margin:8px 0}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:6px 6px;font-size:.82rem;cursor:pointer;color:var(--muted);border-radius:7px}
.seg input:checked + label{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(29,43,51,.12);font-weight:500}
.seg input:focus-visible + label{outline:2px solid var(--ui);outline-offset:-2px}
.chk{display:flex;gap:9px;align-items:center;font-size:.86rem;margin:10px 0 4px;cursor:pointer}
.chk input{accent-color:var(--ui);width:16px;height:16px}
.readout{font:.74rem/1.55 var(--f-mono);color:var(--muted);margin:4px 0 2px}
.readout b{color:var(--ink);font-weight:500}
.inline-btn{display:flex;justify-content:flex-end;margin-top:-2px}
.sublist{border-left:2px solid var(--ui-soft);padding-left:10px;margin-left:2px}
.nogap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-top:14px;padding:11px 14px;border-radius:10px;background:var(--panel-2);font-size:.86rem;line-height:1.45}
.nogap .txt{flex:1 1 420px;min-width:0}
.nogap b{font-weight:600}
.fixed{font-size:.75rem;color:var(--muted);line-height:1.5;margin:8px 0 0}
.lim{font:.68rem/1.3 var(--f-mono);color:var(--muted);text-align:right;margin:-5px 0 6px}
.lim.hit{color:var(--warn)}
.inp.over{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
main.out{display:grid;gap:22px;min-width:0;align-content:start}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px 14px;min-width:0;display:flex;flex-direction:column;gap:3px}
.kpi .k{font:500 .68rem var(--f-mono);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.kpi .v{font-weight:600;font-size:1.65rem;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.kpi .v small{font-size:.9rem;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .s{font-size:.8rem;color:var(--muted);line-height:1.35}
.kpi.total{background:var(--ui-soft);border-color:transparent}
.kpi.total .v{color:var(--ui)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.card .head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:12px}
.card h2{font-weight:600;font-size:1.05rem;margin:0;text-wrap:balance}
.note{font-size:.8rem;color:var(--muted)}
.fig{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto}
#fvWrap svg{min-width:680px}
#planWrap svg{min-width:640px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted);margin-top:12px}
.advice{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--panel-2);font-size:.85rem;line-height:1.45}
.advice b{font-weight:600}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.towgrid{display:grid;gap:18px 24px;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
.towgrid + .towgrid{margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
@media (max-width:980px){.towgrid{grid-template-columns:minmax(0,1fr)}}
.card h3{font-size:.9rem;font-weight:600;margin:0 0 8px}
#towWrap svg{min-width:560px}
#towTable td:first-child,#towSens td:first-child{white-space:normal}
#towTable td,#towTable th,#towSens td,#towSens th{padding:6px 8px}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--panel);font:.72rem/1.45 var(--f-mono);padding:6px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-112%);z-index:2}
.calrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:8px 0}
.calrow label{font-size:.76rem;color:var(--muted);display:block;margin-bottom:3px}
.calout{font-size:.82rem;margin:6px 0 8px;min-height:1.3em}
@media (min-width:1180px){#checks{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:30px}}
.two{display:grid;gap:22px;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.two.bottom{grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr)}
@media (max-width:960px){.two,.two.bottom{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-block;font:500 .66rem var(--f-mono);letter-spacing:.07em;padding:2px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap;text-align:center}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--panel-2);color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;align-items:start;font-size:.85rem;line-height:1.45}
.checks li .pill{margin-top:2px}
.checks li b{font-weight:600}
.tablewrap{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
#hrsTable td:first-child{white-space:normal;min-width:150px}
#linesTable td,#linesTable th{padding:7px 6px}
th:first-child,td:first-child,th.l,td.l{text-align:left}
thead th{position:sticky;top:0;background:var(--panel-2);font:500 .66rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);z-index:1}
tbody tr:last-child td{border-bottom:0}
tr.sub td{font-weight:600;background:var(--panel-2)}
tr.tot td{font-weight:600;background:var(--ui-soft);color:var(--ui)}
td .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:2px 0 14px;background:var(--panel-2)}
.bar span{display:block;height:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{font-size:.8rem;color:var(--ok);min-height:1.2em}
details.how{font-size:.86rem;color:var(--muted)}
details.how summary{cursor:pointer;color:var(--ink);font-weight:500}
details.how ul{margin:10px 0 0;padding-left:18px;display:grid;gap:5px;max-width:95ch}
footer.fine{font-size:.76rem;color:var(--muted);max-width:100ch;margin-top:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Towed side scan · EdgeTech 4125 / 4200</p>
      <h1>Side Scan Run-line Planner</h1>
      <p class="sub">Enter the sonar, survey size and speed. Swath, overlap, layback, run-lines and operation hours update as you type.</p>
    </div>
  </header>

  <div class="app">
    <form class="controls" id="form" autocomplete="off">
      <fieldset>
        <legend>Sonar</legend>
        <div class="f full"><div class="inp"><select id="model" aria-label="Sonar model"></select></div></div>
        <div class="f full"><div class="inp"><select id="channel" aria-label="Frequency used for line spacing"></select></div></div>
        <div class="readout" id="sonarReadout"></div>
        <div class="f"><label for="range">Range per side</label><div class="inp"><input id="range" type="number" step="5" min="10"><span class="u">m</span></div></div>
        <div class="lim" id="lim_range"></div>
        <div class="f"><label for="alt">Fish altitude</label><div class="inp"><input id="alt" type="number" step="0.5" min="1"><span class="u">m</span></div></div>
        <div class="lim" id="lim_alt"></div>
        <div class="inline-btn"><button class="btn small" type="button" id="alt10">Set to 10 % of range</button></div>
      </fieldset>

      <fieldset>
        <legend>Survey</legend>
        <div class="seg" role="radiogroup" aria-label="Survey type">
          <input type="radio" name="mode" id="modeRoute" value="route"><label for="modeRoute">Pipeline</label>
          <input type="radio" name="mode" id="modeArea" value="area"><label for="modeArea">Area</label>
        </div>
        <div id="routeBox">
          <div class="f"><label for="routeKm">Pipeline length</label><div class="inp"><input id="routeKm" type="number" step="0.1" min="0.05"><span class="u">km</span></div></div>
          <div class="f"><label for="corrW">Corridor width</label><div class="inp"><input id="corrW" type="number" step="50" min="10"><span class="u">m</span></div></div>
        </div>
        <div id="areaBox" hidden>
          <div class="f"><label for="areaW">Width (across lines)</label><div class="inp"><input id="areaW" type="number" step="50" min="20"><span class="u">m</span></div></div>
          <div class="f"><label for="areaL">Length (along lines)</label><div class="inp"><input id="areaL" type="number" step="50" min="50"><span class="u">m</span></div></div>
          <div class="lim" id="areaOut"></div>
        </div>
        <div class="f"><label for="wd">Water depth</label><div class="inp"><input id="wd" type="number" step="1" min="2"><span class="u">m</span></div></div>
        <div class="lim" id="lim_wd"></div>
        <div class="seg" role="radiogroup" aria-label="Coverage">
          <input type="radio" name="coverage" id="cov200" value="200"><label for="cov200">200 % · fills nadir</label>
          <input type="radio" name="coverage" id="cov100" value="100"><label for="cov100">100 %</label>
        </div>
        <div class="f"><label for="sidelap">Overlap</label><div class="inp"><input id="sidelap" type="number" step="1" min="0" max="90"><span class="u">%</span></div></div>
        <div class="f"><label for="ext">Extend lines past ends</label><div class="inp"><input id="ext" type="number" step="50" min="0"><span class="u">m</span></div></div>
        <label class="chk" for="hfOn"><input type="checkbox" id="hfOn"> High-frequency pair along the route</label>
        <div id="hfBox" class="sublist">
          <div class="f"><label for="hfOff">Offset each side of CL</label><div class="inp"><input id="hfOff" type="number" step="5" min="5"><span class="u">m</span></div></div>
          <div class="lim" id="lim_hfOff"></div>
          <div class="f"><label for="hfAlt">Pair altitude</label><div class="inp"><input id="hfAlt" type="number" step="0.5" min="1"><span class="u">m</span></div></div>
          <div class="lim" id="lim_hfAlt"></div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Tow and time</legend>
        <div class="f"><label for="speed">Survey speed</label><div class="inp"><input id="speed" type="number" step="0.1" min="0.5"><span class="u">kn</span></div></div>
        <div class="lim" id="lim_speed"></div>
        <div class="f full"><div class="inp"><select id="cable" aria-label="Tow cable">
        </select></div></div>
        <div class="f full"><div class="inp"><select id="dep" aria-label="Depressor or added weight"></select></div></div>
        <div class="f"><label for="pre">Deployment, checks, recovery</label><div class="inp"><input id="pre" type="number" step="0.5" min="0"><span class="u">h</span></div></div>
        <div class="f"><label for="cont">Weather contingency</label><div class="inp"><input id="cont" type="number" step="1" min="0"><span class="u">%</span></div></div>
        <p class="fixed">Fixed: 10 % infill and re-runs, 1 m target with 3 pings, tow point 5 m above the sea, 10°/min turns, 300 m straight run before SOL, 100 m overrun, sound velocity cast every 12 h. High Speed Mode is used on the 4200-MP only when needed. Transit to site is not included. Sonar limits from the EdgeTech 4200 and 4125 manuals.</p>
        <div class="inline-btn"><button class="btn small" type="button" id="resetBtn">Reset inputs</button></div>
      </fieldset>
    </form>

    <\!-- ======================= OUTPUT ======================= -->
    <main class="out">
      <section class="kpis" id="kpis" aria-label="Key numbers"></section>

      <section class="card" aria-labelledby="fvTitle">
        <div class="head">
          <h2 id="fvTitle">Front view · swath, overlap and altitude</h2>
          <span class="note" id="fvNote"></span>
        </div>
        <div class="fig" id="fvWrap"></div>
        <div class="legend" id="fvLegend"></div>
        <div class="advice" id="fvAdvice"></div>
        <div class="nogap" id="noGap"></div>
      </section>

      <section class="card" aria-labelledby="towTitle">
        <div class="head">
          <h2 id="towTitle">Tow profile · cable out and layback</h2>
          <span class="note" id="towHead"></span>
        </div>
        <div class="towgrid">
          <div class="fig" id="towWrap"></div>
          <div>
            <div class="tablewrap"><table id="towTable"></table></div>
            <p class="note" id="towNote" style="margin:10px 0 0"></p>
          </div>
        </div>
        <div class="towgrid">
          <div>
            <h3>Cable out and layback against speed through water</h3>
            <div class="chartbox" id="towChart"></div>
            <div class="legend" id="towChartLegend"></div>
            <div class="tablewrap" style="margin-top:12px"><table id="towSens"></table></div>
          </div>
          <div>
            <h3>Calibrate to a known point</h3>
            <p class="note" style="margin:0">Enter one observed point from a wet test, or read one off EdgeTech's towing-characteristics chart for your cable. The model then fits its cable drag to it and the likely range narrows.</p>
            <div class="calrow">
              <div><label for="calV">Speed</label><div class="inp"><input id="calV" type="number" step="0.1" min="0.5" placeholder="–"><span class="u">kn</span></div></div>
              <div><label for="calL">Cable out</label><div class="inp"><input id="calL" type="number" step="5" min="5" placeholder="–"><span class="u">m</span></div></div>

          <summary>How the numbers are worked out</summary>
          <ul>
            <li><b>Input limits</b> follow the selected sonar: range per side up to the datasheet maximum for the chosen frequency; water depth no deeper than the towfish depth rating plus altitude; altitude up to 25 % of range; HF pair offset small enough that the two swaths still cover each other's nadir; speed from 1 to 4 kn, the normal band for towed side scan (the sonars are rated to 12 kn and 8 kn). The 3-ping rule is reported as a design check because it depends on the range in use. A value outside its limit is pulled back to the limit and the note under the field turns amber.</li>
            <li><b>Swath</b> per line = 2 × √(range² − altitude²). The nadir gap under the fish is the seabed width below the inner beam edge (array depression + half the 50° vertical beam): 51° for the 4200's 26° arrays (gap ≈ 1.6 × altitude) and 58° for the 4125's 33° factory setting (≈ 1.25 × altitude).</li>
            <li><b>200 % coverage</b> splits the lines into two interleaved 100 % sets. Lines in one set are spaced swath × (1 − sidelap); adjacent lines are half that. Each sidelap band sits over the nadir of a line in the other set, so the nadir gap is filled when the sidelap band is wider than the nadir gap.</li>
            <li><b>100 % coverage</b> spaces lines at swath × (1 − sidelap). Nadir gaps stay unfilled.</li>
            <li><b>Number of lines</b> is the smallest symmetric set (lines at ±½, ±1½ … spacings from CL) that reaches the coverage target across the full corridor or area width.</li>
            <li><b>Cable out and layback</b> come from a steady two-dimensional tow-cable model integrated from the towfish up to the tow point. Each metre of cable carries its weight in sea water, normal drag ½ρ·Cn·d·(V sin φ)² and tangential friction; the towfish adds its weight in salt water, its own drag and any depressor force. Cn is 1.5 with a likely range of 1.2–1.8, or fitted to a point you enter. Values are best estimates rounded to 5 m, with no padding. Layback is the horizontal distance from the tow point to the fish; the catenary factor is that distance divided by the straight-line value √(cable² − depth²). EdgeTech publishes modelled tow charts for the same cables; use one of their points, or a wet-test point, to calibrate.</li>
            <li><b>Pings on target</b>: the strict rule (NOAA, IHO S-44) counts pings on a 1 m target with no credit for beam width. EdgeTech rates that at 4.8 kn at 100 m range (4125, 4200-SP and 4200-MP High Definition Mode), 9.6 kn for the 4200-MP in High Speed Mode. The limit scales with 100 ÷ range because the ping rate is 1500 ÷ (2 × range).</li>
            <li><b>High Speed Mode</b> (4200-MP multi-pulse) is switched on only when single pulse gives fewer than 3 pings; it uses the wider HSM beam widths from the manual.</li>
            <li><b>Vessel time on line</b> = straight run before SOL + fish data length + layback + overrun. Turn radius = speed ÷ rate of turn. Turns are semicircles, a quarter-turn–straight–quarter-turn for wide jumps, or a keyhole loop for lines closer than about 1.6 × the turn radius. Adjacent lines run in opposite directions.</li>
            <li><b>Hours</b>: on-line and turn time at survey speed, plus 10 % infill, a sound velocity cast for every 12 h of survey started (at least one), and your deployment/recovery time. The contingency % is applied to that subtotal. Transit to and from site is not included.</li>
          </ul>

  for (; n <= 150; n++){
    offsets = []; for (let k=n-1; k>=0; k--) offsets.push(-(k+0.5)*S); for (let k=0; k<n; k++) offsets.push((k+0.5)*S);
    if (ok(offsets)) { reached = true; break; }
    if (two && !nadirFilled && n > half/S + 3) break;
  }
  if (!reached){ n = Math.max(1, Math.ceil(half/S + 0.5)); offsets=[]; for (let k=n-1;k>=0;k--) offsets.push(-(k+0.5)*S); for (let k=0;k<n;k++) offsets.push((k+0.5)*S); }

  // coverage extents
  const extentOf = (offs, xo_, xin_, needN, nadirCounts) => { let x = 0; const st = 0.5; while (foldAt(x, offs, xo_, xin_, nadirCounts) >= needN && x < 1e5) x += st; return x - st; };
  const ext200 = two ? extentOf(offsets, xo, xin, 2, false) : NaN;
  const ext100 = extentOf(offsets, xo, xin, 1, true);
  reached = (two ? ext200 : ext100) >= half - 0.5;

  // speed / pings
  const rIn = h/Math.sin(inner), V = p.speed*KN;
  const prf1 = 1500/(2*R);                                   // one ping per two-way travel time at the set range
  const pings1 = prf1*p.target/V, vmax1 = M.ping100*100/R;   // EdgeTech: 4.8 kn at 100 m for 3 pings on 1 m
  const mp = M.mp && pings1 < p.npings;                      // 4200-MP: High Speed Mode only when single pulse falls short
  const prf = (mp ? 2 : 1)*prf1;
  const pings = prf*p.target/V;
  const vmax = vmax1*(M.mp ? 2 : 1);
  const pingSpacing = V/prf;
  const beamUsed = mp ? ch.beamMP : ch.beam;

  // tow
  const r5 = x => Math.round(x/5)*5, sheave = p.sheave||0;
  const towBase = V2 => { const dp = depressor(p.dep, M, V2);
    return {Vkn:V2, sheave, d:p.cabD, w:p.cabW, fishKg:M.wWater + dp.kg, cda:M.cda, lift:dp.lift, drag:dp.drag}; };
  let cal = null;
  if ([p.calV, p.calL, p.calD].every(v => isFinite(v) && v > 0)){
    cal = p.calL > p.calD + sheave ? fitCn(towBase(p.calV), {V:p.calV, L:p.calL, D:p.calD})
                                   : {cn:null, why:"cable out must be longer than the fish depth plus the tow point height"};
  }
  const cn0 = cal && cal.cn ? cal.cn : CN_NOM, cnLo = cal && cal.cn ? cn0*0.9 : CN_LO, cnHi = cal && cal.cn ? cn0*1.1 : CN_HI;
  const solve = (depth, cn, V2 = p.speed) => towSolve(Object.assign(towBase(V2), {depth, cn}));
  const sol3 = depth => { const a = solve(depth, cn0), lo = solve(depth, cnLo), hi = solve(depth, cnHi);
    const vert = depth + sheave, sl = Math.sqrt(Math.max(a.cable*a.cable - vert*vert, 1e-9));
    return {tow:a, towLo:lo, towHi:hi, CO:r5(a.cable), LB:r5(a.layback), coLo:r5(lo.cable), coHi:r5(hi.cable), lbLo:r5(lo.layback), lbHi:r5(hi.layback),
            straight:sl, cf:a.layback/sl, scope:a.cable/depth}; };
  const msol = sol3(p.wd - h), tow = msol.tow, CO = msol.CO, LB = msol.LB;
  const sens = [];
  for (let v2 = 1; v2 <= 5.001; v2 += 0.25){
    const a = solve(p.wd - h, cn0, v2), lo = solve(p.wd - h, cnLo, v2), hi = solve(p.wd - h, cnHi, v2);
    sens.push({v:v2, co:a.cable, lb:a.layback, coLo:lo.cable, coHi:hi.cable, ok:a.reached});
  }
  const hfOn = p.hfOn && isFinite(p.hfOff) && p.hfOff > 0 && p.hfRange > p.hfAlt && p.hfAlt < p.wd;
  let hf = null;
  if (hfOn){
    const xinH = p.hfAlt/Math.tan(inner), xoH = Math.sqrt(p.hfRange**2 - p.hfAlt**2);
    const hs = sol3(p.wd - p.hfAlt);
    hf = {off:p.hfOff, R:p.hfRange, h:p.hfAlt, xin:xinH, xo:xoH, tow:hs.tow, sol:hs, CO:hs.CO, LB:hs.LB,
          overlap: 2*xoH - 2*p.hfOff, ch:hfCh, ext:p.hfExt||0};
    hf.filled = hf.overlap >= 2*xinH;
    hf.pings1 = 1500/(2*p.hfRange)*p.target/V; hf.mp = M.mp && hf.pings1 < p.npings;
    hf.pings = hf.pings1*(hf.mp ? 2 : 1);
    hf.ext200 = extentOf([-p.hfOff, p.hfOff], xoH, xinH, 2, false);
    hf.ext100 = extentOf([-p.hfOff, p.hfOff], xoH, xinH, 1, true);
  }

  // lines
  const Rt = (p.speed*1852/60)/(Math.max(1,p.rot)*D2R);
  const settle = p.settle||0, runout = p.runout||0, ext = p.ext||0;
  const mk = (name, kind, off, dir, y0, y1, lb, co, Rr, alt, freq) => {
    const sol = dir > 0 ? y0 : y1, eol = dir > 0 ? y1 : y0;
    return {name, kind, off, dir, y0, y1, sol, eol, data:y1-y0, lb, co, R:Rr, alt, freq,
      join: sol - dir*settle, vend: eol + dir*(lb + runout), vessel: settle + (y1-y0) + lb + runout};
  };
  const names = new Set();
  const uniq = nm => { let s = nm; while (names.has(s)) s += "b"; names.add(s); return s; };
  const main = offsets.map((off, i) => mk(uniq(`${p.channel}-${off<0?"P":"S"}${pad4(off)}`), "main", off, i%2===0 ? 1 : -1,
      -ext, length + ext, LB, CO, R, h, ch.f));
  // greedy order: alternate directions, cheapest turn first
  const cost = (a, b) => {
    const dx = Math.abs(a.off - b.off);
    if (a.dir === b.dir) return dx + (a.y1 - a.y0) + 2*Math.PI*Rt;
    return turnLen(dx, Math.abs(a.vend - b.join), Rt);
  };
  const seq = [];
  if (hf){
    seq.push(mk(uniq(`HF-S${pad4(hf.off)}`), "hf", hf.off, 1, -hf.ext, length + hf.ext, hf.LB, hf.CO, hf.R, hf.h, hfCh.f));
    seq.push(mk(uniq(`HF-P${pad4(hf.off)}`), "hf", -hf.off, -1, -hf.ext, length + hf.ext, hf.LB, hf.CO, hf.R, hf.h, hfCh.f));
  }
  const used = new Array(main.length).fill(false);
  let cur = 0; used[0] = true; seq.push(main[0]);
  for (let c=1; c<main.length; c++){
    const a = main[cur]; let best = -1, bc = Infinity;
    for (let j=0; j<main.length; j++){ if (used[j] || main[j].dir === a.dir) continue; const cc = cost(a, main[j]); if (cc < bc){ bc = cc; best = j; } }
    if (best < 0) for (let j=0; j<main.length; j++){ if (!used[j]) { best = j; break; } }
    used[best] = true; seq.push(main[best]); cur = best;
  }
  seq.forEach((l, i) => { l.order = i+1; l.turn = i < seq.length-1 ? cost(l, seq[i+1]) : 0; });

  // hours
  const kmh = p.speed*1.852, H = m => m/1000/kmh;
  const sum = (arr, f) => arr.reduce((t, x) => t + f(x), 0);
  const hfLines = seq.filter(l => l.kind === "hf"), mainLines = seq.filter(l => l.kind === "main");
  const hrs = {};
  hrs.dataMain = H(sum(mainLines, l => l.data));
  hrs.runMain = H(sum(mainLines, l => l.vessel - l.data));
  hrs.dataHf = H(sum(hfLines, l => l.data));
  hrs.runHf = H(sum(hfLines, l => l.vessel - l.data));
  hrs.turns = H(sum(seq, l => l.turn));
  hrs.survey = hrs.dataMain + hrs.runMain + hrs.dataHf + hrs.runHf + hrs.turns;
  hrs.svpN = Math.max(1, Math.ceil(hrs.survey / Math.max(1, p.svpInt||12)));   // at least one cast, then one per 12 h started
  hrs.svp = hrs.svpN * (p.svpDur||0);
  hrs.infill = hrs.survey*(p.infill||0)/100;
  hrs.pre = p.pre||0; hrs.recov = p.recov||0; hrs.transit = p.transit||0;
  hrs.subtotal = hrs.pre + hrs.transit + hrs.survey + hrs.svp + hrs.infill + hrs.recov;
  hrs.cont = hrs.subtotal*(p.cont||0)/100;
  hrs.total = hrs.subtotal + hrs.cont;
  hrs.days = hrs.total/(parseFloat(p.dayH)||24);
  const dataKm = sum(seq, l => l.data)/1000, vesselKm = sum(seq, l => l.vessel + l.turn)/1000;

  return {p, M, ch, R, h, xin, xo, W, S, sAuto, manual, two, sidelapAct, overlapBand, nadirFilled, corridor, length,
    offsets, n:offsets.length, reached, ext200, ext100, prf, pings, vmax, pings1, vmax1, pingSpacing, mp, rIn, beamUsed,
    tow, main:msol, sens, cal, cn0, cnLo, cnHi, CO, LB, hf, seq, Rt, hrs, dataKm, vesselKm, fishDepth:p.wd-h, ext, errors:[]};
}

/* ---------- checks ---------- */
function checks(r){
  const p = r.p, out = [], add = (s, t) => out.push([s, t]);
  add(r.R <= r.ch.max ? "ok" : "bad", `<b>Range ${fmt(r.R)} m</b> ${r.R <= r.ch.max ? "is within" : "exceeds"} the ${fmt(r.ch.f)} kHz maximum of ${fmt(r.ch.max)} m.`);
  const ap = r.h/r.R*100;
  add(ap >= 10 - 1e-9 && ap <= 15 + 1e-9 ? "ok" : (ap >= 8 && ap <= 20 ? "warn" : "bad"),
    `<b>Altitude ${fmt(r.h,1)} m is ${fmt(ap,1)} % of range.</b> EdgeTech recommends 10–15 % (${fmt(r.R*0.1,1)}–${fmt(r.R*0.15,1)} m)${ap < 10 ? `; lower than that, the far range is hit at ${fmt(Math.asin(r.h/r.R)/D2R,1)}° and returns weaken` : ap > 15 ? "; higher than that, the outer range is used less efficiently" : ""}.`);
  const od = r.M.dep - r.M.vbw/2;
  if (od > 0){
    const edge = r.h/Math.tan(od*D2R), hNeed = r.R*Math.sin(od*D2R);
    add(edge >= r.xo ? "ok" : "warn", edge >= r.xo
      ? `<b>Beam reaches full range.</b> The outer beam edge (${fmt(od)}° below horizontal at ${fmt(r.M.dep)}° depression) meets the seabed beyond ${fmt(r.xo)} m.`
      : `<b>Outer beam falls short.</b> At ${fmt(r.M.dep)}° depression the outer beam edge meets the seabed at ${fmt(edge)} m, inside the ${fmt(r.xo)} m swath edge. Fly at ${fmt(hNeed,1)} m or higher${r.M.family === "4125" ? ", or set the arrays to 25°" : ""}.`);
  }
  if (r.two) add(r.nadirFilled ? "ok" : "bad", r.nadirFilled
      ? `<b>Nadir gaps are filled.</b> Each ${fmt(r.overlapBand)} m sidelap band covers a ${fmt(2*r.xin)} m nadir gap of the other set.`
      : `<b>Nadir gaps are not filled.</b> The ${fmt(r.overlapBand)} m sidelap band is narrower than the ${fmt(2*r.xin)} m nadir gap. Increase sidelap or range, or lower the altitude.`);
  else add("warn", `<b>100 % coverage leaves nadir gaps</b> of about ${fmt(2*r.xin)} m under every line. Use 200 % or offset infill lines if the nadir must be covered.`);
  if (r.manual) add(r.sidelapAct*100 >= p.sidelap - 0.5 ? "ok" : "warn", `<b>Manual spacing ${fmt(r.S,1)} m</b> gives ${fmt(r.sidelapAct*100,1)} % sidelap against the ${fmt(p.sidelap)} % target.`);
  const covTxt = r.two ? `≥ 200 % to ±${fmt(r.ext200)} m` : `100 % to ±${fmt(r.ext100)} m`;
  add(r.reached ? "ok" : "bad", r.reached ? `<b>Coverage</b> ${covTxt} across the ${fmt(r.corridor)} m ${p.mode === "route" ? "corridor" : "area width"} with ${r.n} lines.` : `<b>Coverage target not reached</b> across the ${fmt(r.corridor)} m width. Check sidelap and nadir settings.`);
  if (r.pings < p.npings - 1e-6){
    const beta = r.beamUsed*D2R, r3 = Math.max(0, (p.npings*r.pingSpacing - p.target)/beta);
    add("warn", `<b>Above the strict 3-ping speed.</b> NOAA and IHO count 3 pings on a 1 m target with no credit for beam width: at ${fmt(r.R)} m range that allows ${fmt(r.vmax,1)} kn${r.M.mp ? " in High Speed Mode" : ""} (EdgeTech: 4.8${r.M.mp ? " / 9.6" : ""} kn at 100 m). At ${fmt(p.speed,1)} kn pings land ${fmt(r.pingSpacing,2)} m apart, so a 1 m target gets ${fmt(r.pings,1)}. Counting the ${r.beamUsed}° beam it is still hit 3 times beyond ${fmt(r3)} m range${r.two ? ", and the neighbouring line covers the near range" : ""}. Slow down or shorten the range if the survey must meet the strict rule.`);
  }
  else if (r.mp) add("warn", `<b>Run High Speed Mode (multi-pulse).</b> At ${fmt(r.R)} m range the single-pulse limit is ${fmt(r.vmax1,1)} kn; HSM allows ${fmt(r.vmax,1)} kn (EdgeTech: 4.8 / 9.6 kn at 100 m). Beam widens to ${r.beamUsed}°.`);
  else add("ok", `<b>${fmt(r.pings,1)} pings</b> on a 1 m target at ${fmt(p.speed,1)} kn. ${r.M.mp ? "High Definition Mode (single pulse) is enough" : "Within the rating"} up to ${fmt(r.vmax1,1)} kn at ${fmt(r.R)} m range.`);
  add(r.fishDepth <= r.M.depth ? "ok" : "bad", `<b>Fish depth ${fmt(r.fishDepth,1)} m</b> against a ${fmt(r.M.depth)} m depth rating.`);
  const sols = [r.main, ...(r.hf ? [r.hf.sol] : [])], cabName = p.cab.label.split(" · ")[0];
  const need = Math.max(...sols.map(q => q.CO)), needHi = Math.max(...sols.map(q => q.coHi));
  if (sols.some(q => !q.tow.reached)) add("bad", `<b>This cable cannot reach the depth</b> at ${fmt(p.speed,1)} kn: the ${cabName} cable flattens out before the fish gets to ${fmt(p.wd - Math.min(r.h, r.hf ? r.hf.h : r.h),1)} m. Use a heavier cable, fit a depressor or slow down.`);
  else if (r.M.family === "4125"){
    const lim2 = Math.min(r.M.cableMaxTel, p.cab.maxLen || 1e9);
    add(needHi <= r.M.cableMax ? "ok" : (needHi <= lim2 ? "warn" : "bad"),
      needHi <= r.M.cableMax ? `<b>Cable out ${fmt(need)} m</b> (up to ${fmt(needHi)} m) is within the 150 m maximum for a 4125 without telemetry.`
      : needHi <= lim2 ? `<b>Cable out ${fmt(need)} m (up to ${fmt(needHi)} m) needs the telemetry option.</b> The 4125 allows 150 m of cable without it and ${fmt(lim2)} m with it on this cable.`
      : `<b>Cable out ${fmt(need)} m (up to ${fmt(needHi)} m) exceeds the ${fmt(lim2)} m maximum</b> for a 4125 on this cable. Add the keel weight, slow down or use a 4200.`);
  }
  else add(needHi <= r.M.cableMax ? "ok" : "bad", `<b>Cable out ${fmt(need)} m</b> (up to ${fmt(needHi)} m), against the 4200's 6,000 m maximum tow cable length. Carry at least ${fmt(Math.ceil(needHi*1.3/50)*50)} m on the winch.`);
  if (p.cab.wl){ const tmax = Math.max(...sols.map(q => q.towHi.tension)); add(tmax <= p.cab.wl*0.5 ? "ok" : "warn", `<b>Steady cable tension ${fmt(tmax,2)} kN</b> at the tow point, ${fmt(tmax/p.cab.wl*100)} % of the ${cabName} working load (${p.cab.wl} kN). Snatch loads in a seaway are higher.`); }
  if (r.hf){
    const hfOkR = r.hf.R <= r.hf.ch.max;
    add(hfOkR && r.hf.filled ? "ok" : "bad", `<b>HF pair</b> at ±${fmt(r.hf.off)} m, ${fmt(r.hf.ch.f)} kHz, range ${fmt(r.hf.R)} m: overlap ${fmt(r.hf.overlap)} m ${r.hf.filled ? "covers" : "does not cover"} its ${fmt(2*r.hf.xin)} m nadir gaps${r.hf.filled ? "" : ". Reduce the pair offset"}.`);
    const ap2 = r.hf.h/r.hf.R*100;
    if (ap2 < 10 - 1e-9 || ap2 > 15 + 1e-9) add("warn", `<b>HF pair altitude</b> is ${fmt(ap2,1)} % of its ${fmt(r.hf.R)} m range. EdgeTech recommends 10–15 % (${fmt(r.hf.R*0.1,1)}–${fmt(r.hf.R*0.15,1)} m).`);
    if (r.hf.pings < p.npings - 1e-6) add("warn", `<b>HF pair is above the strict 3-ping speed</b> (${fmt(r.M.ping100*100/r.hf.R*(r.M.mp ? 2 : 1),1)} kn at ${fmt(r.hf.R)} m range): ${fmt(r.hf.pings,1)} pings on a 1 m target at ${fmt(p.speed,1)} kn.`);
    else if (r.hf.mp) add("warn", `<b>HF pair needs High Speed Mode</b> at ${fmt(p.speed,1)} kn (single-pulse limit ${fmt(r.M.ping100*100/r.hf.R,1)} kn at ${fmt(r.hf.R)} m).`);
  }
  add("info", `<b>Turns:</b> radius about ${fmt(r.Rt)} m at ${fmt(p.speed,1)} kn and ${fmt(p.rot)}°/min. Haul in or speed up before turning so a fish flown low does not sink towards the seabed.`);
  return out;
}

/* ---------- drawing: palette ---------- */
const VARS = ["bg","panel","panel-2","ink","muted","line","accent","accent-soft","seta","setb","hf","nadir","seabed","water","fold1","fold2","fold3","cable","lay"];
const pageC = Object.fromEntries(VARS.map(v => [v, `var(--${v})`]));
function resolvedC(){ const cs = getComputedStyle(document.documentElement); return Object.fromEntries(VARS.map(v => [v, cs.getPropertyValue(`--${v}`).trim()])); }
const MONO = "IBM Plex Mono, ui-monospace, Menlo, monospace";
const T = (x, y, s, C, o={}) => `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="fill:${o.fill||C.ink};font:${o.w||400} ${o.size||11}px ${MONO}" text-anchor="${o.a||"start"}"${o.dom?` dominant-baseline="${o.dom}"`:""}>${esc(s)}</text>`;
const Rc = (x, y, w, h, st) => `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${Math.max(0,w).toFixed(1)}" height="${Math.max(0,h).toFixed(1)}" style="${st}"/>`;
const Ln = (x1, y1, x2, y2, st) => `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" style="${st}"/>`;
function dimH(x1, x2, y, label, C, above=true){
  const st = `stroke:${C.ink};stroke-width:1`;
  return Ln(x1,y,x2,y,st) + Ln(x1,y-4,x1,y+4,st) + Ln(x2,y-4,x2,y+4,st) +
    T((x1+x2)/2, above ? y-5 : y+14, label, C, {a:"middle", size:12, w:500});
}
function niceStep(span, target){ const raw = span/target, m = Math.pow(10, Math.floor(Math.log10(raw))); for (const k of [1,2,2.5,5,10]) if (k*m >= raw) return k*m; return 10*m; }

/* ---------- front view ---------- */
function frontSVG(r, C){
  const VW = 1100, padL = 92, padR = 26, plotW = VW - padL - padR;
  const maxOff = Math.max(...r.offsets.map(Math.abs));
  const half = Math.max(r.corridor/2, maxOff + r.xo, r.hf ? r.hf.off + r.hf.xo : 0)*1.04;
  const sx = plotW/(2*half), X = m => padL + (m + half)*sx;
  const fishY = 96, seabed = 214, altPx = seabed - fishY;
  const VE = (altPx/r.h)/sx;
  let y = seabed + 24; const rowH = 16, gap = 10;
  const sets = r.two ? [r.offsets.filter((_,i)=>i%2===0), r.offsets.filter((_,i)=>i%2===1)] : [r.offsets];
  const rows = sets.map((s, i) => ({s, y: y + i*(rowH+gap), col: i === 0 ? C.seta : C.setb, label: r.two ? (i===0?"Set A":"Set B") : "Swaths"}));
  y += rows.length*(rowH+gap);
  const hfRow = r.hf ? {y} : null; if (hfRow) y += rowH + gap;
  const foldY = y + 4; y = foldY + rowH + 28;
  const VH = y + 8;
  let g = "";
  g += Rc(0, 0, VW, VH, `fill:${C.panel}`);
  // water band + break line
  g += Rc(padL, 40, plotW, seabed-40, `fill:${C.water}`);
  let zz = `M${padL},44`; for (let x=padL; x<padL+plotW; x+=14) zz += ` L${(x+7).toFixed(1)},38 L${Math.min(x+14,padL+plotW).toFixed(1)},44`;
  g += `<path d="${zz}" style="fill:none;stroke:${C.muted};stroke-width:1"/>`;
  g += T(padL + plotW/2, 30, `Water column broken · sea surface ${fmt(r.p.wd)} m above seabed · towfish depth ${fmt(r.fishDepth,1)} m`, C, {a:"middle", fill:C.muted, size:10.5});
  // corridor edges + CL
  for (const s of [-1,1]) { const xx = X(s*r.corridor/2); g += Ln(xx, 52, xx, foldY+rowH, `stroke:${C.muted};stroke-width:1;stroke-dasharray:5 4`); }
  g += T(X(r.corridor/2)-4, 62, r.p.mode==="route" ? "corridor edge" : "area edge", C, {a:"end", fill:C.muted, size:10});
  g += Ln(X(0), 52, X(0), foldY+rowH, `stroke:${C.accent};stroke-width:1;stroke-dasharray:2 3`);
  // beams
  const many = r.offsets.length > 24;
  sets.forEach((s, si) => {
    const col = si === 0 ? C.seta : C.setb;
    for (const L of s){
      for (const sg of [-1,1]){
        g += `<polygon points="${X(L).toFixed(1)},${fishY} ${X(L+sg*r.xin).toFixed(1)},${seabed} ${X(L+sg*r.xo).toFixed(1)},${seabed}" style="fill:${col};fill-opacity:.13;stroke:${col};stroke-opacity:.75;stroke-width:.9"/>`;
      }
      if (!many) g += Ln(X(L), 46, X(L), fishY-4, `stroke:${C.muted};stroke-width:.8;stroke-dasharray:3 3`);
      g += `<ellipse cx="${X(L).toFixed(1)}" cy="${fishY}" rx="7" ry="2.8" style="fill:${col}"><title>${esc(`${r.p.channel} line at ${L<0?"P":"S"} ${fmt(Math.abs(L),1)} m`)}</title></ellipse>`;
      g += Rc(X(L-r.xin), seabed-1, 2*r.xin*sx, 4, `fill:${C.nadir}`);
    }
  });
  g += Rc(padL, seabed, plotW, 6, `fill:${C.seabed}`);
  g += T(padL+plotW, seabed+18, "seabed", C, {a:"end", fill:C.muted, size:10});
  // labels above fish
  const showLbl = sx*r.S >= 52;

  // offset labels (main lines only, thinned)
  const lblStep = Math.max(1, Math.ceil(16/(r.S*sy)));
  r.offsets.forEach((o,i) => { if (i % lblStep === 0) g += T(padL-8, Y(o), `${o<0?"P":"S"} ${fmt(Math.abs(o))}`, C, {a:"end", size:9.5, fill:C.muted, dom:"middle"}); });
  // KP axis
  const by = padT + plotH + 16;
  const kps = [0, L]; if (r.ext > 0) kps.push(-r.ext, L + r.ext);
  const stp = niceStep(L, Math.max(1, L*sx/110)); for (let v = stp; v < L - stp*0.6; v += stp) kps.push(v);
  [...new Set(kps.map(v => Math.round(v)))].forEach(v => {
    g += Ln(X(v), padT+plotH, X(v), padT+plotH+5, `stroke:${C.muted}`);
    g += T(X(v), by, `KP ${(v/1000).toFixed(3)}`, C, {a:"middle", size:9.5, fill:C.muted});
  });
  const aspect = (2*oMax*sx)/plotH;
  g += T(padL, VH-10, aspect > 1.4 || aspect < 0.7 ? "Schematic: cross-track scale is stretched for readability" : "Plan at true scale", C, {size:9.5, fill:C.muted});
  g += T(VW-padR, VH-10, `${r.p.mode==="route" ? "corridor" : "area"} ${fmt(r.corridor)} m wide × ${fmt(L)} m long (${fmt(r.corridor*L/1e6,2)} km²)${r.ext>0 ? ` · lines extend ${fmt(r.ext)} m past each end` : ""}`, C, {a:"end", size:9.5, fill:C.muted});
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${VW} ${VH.toFixed(0)}" role="img" aria-label="Plan of run-lines">${g}</svg>`;
}

/* ---------- limit display / commit ---------- */
function showLimits(p){
  for (const id of LIM_IDS){
    const el = $(id), [lo, hi, unit, why] = p._lim[id], raw = p._raw[id];
    el.min = lo; el.max = hi;
    const nf = x => fmt(x, Math.abs(Math.round(x*10) - x*10) > 1e-6 ? 2 : (Math.abs(x % 1) > 1e-9 ? 1 : 0));
    const hit = isFinite(raw) && (raw < lo - 1e-9 || raw > hi + 1e-9);
    el.closest(".inp").classList.toggle("over", hit);
    const box = $("lim_" + id);
    const range = `${nf(lo)}–${nf(hi)} ${unit}`;
    if (box){ box.textContent = hit ? `Limited to ${nf(p[id])} ${unit}${why ? " · " + why : ""}` : `${range}${why ? " · " + why : ""}`; box.classList.toggle("hit", hit); }
    el.title = hit ? `Limited to ${nf(p[id])} ${unit}` : `Allowed ${range}`;
  }
}
function commitLimits(){
  const p = readParams();
  for (const id of LIM_IDS){
    const raw = p._raw[id], [lo, hi] = p._lim[id];
    if (isFinite(raw) && (raw < lo - 1e-9 || raw > hi + 1e-9)) $(id).value = +p[id].toFixed(2);
  }
}

/* ---------- exports ---------- */
function toGrid(off, y, p){
  const b = (p.brg||0)*D2R, e0 = p.e0||0, n0 = p.n0||0;
  return [e0 + y*Math.sin(b) + off*Math.cos(b), n0 + y*Math.cos(b) - off*Math.sin(b)];
}
function csvText(r){
  const p = r.p, head = ["order","line","freq_kHz","range_m","offset_m","side","direction","altitude_m","KP_start","KP_end","fish_data_m","cable_out_m","layback_m","vessel_on_line_m","turn_to_next_m","SOL_E","SOL_N","EOL_E","EOL_N"];
  const rows = r.seq.map(l => { const [se,sn] = toGrid(l.off, l.sol, p), [ee,en] = toGrid(l.off, l.eol, p);
    return [l.order, l.name, l.freq, l.R, l.off.toFixed(2), l.off<0?"P":"S", l.dir>0?"up-KP":"down-KP", l.alt, (l.sol/1000).toFixed(3), (l.eol/1000).toFixed(3),
      l.data.toFixed(0), l.co, l.lb, l.vessel.toFixed(0), l.turn.toFixed(0), se.toFixed(2), sn.toFixed(2), ee.toFixed(2), en.toFixed(2)]; });
  return [head, ...rows].map(a => a.join(",")).join("\r\n") + "\r\n";
}
function dxfText(r){
  const p = r.p, out = [], P = (c,v) => out.push(String(c), String(v));
  const line = (layer, col, a, b) => { P(0,"LINE"); P(8,layer); P(62,col); P(10,a[0].toFixed(3)); P(20,a[1].toFixed(3)); P(30,0); P(11,b[0].toFixed(3)); P(21,b[1].toFixed(3)); P(31,0); };
  const text = (layer, col, at, h, s) => { P(0,"TEXT"); P(8,layer); P(62,col); P(10,at[0].toFixed(3)); P(20,at[1].toFixed(3)); P(30,0); P(40,h); P(1,s); P(50, (90 - (p.brg||0)).toFixed(2)); };
  P(0,"SECTION"); P(2,"ENTITIES");
  const g = (o, y) => toGrid(o, y, p), L = r.length, hw = r.corridor/2, th = Math.max(4, r.S/12);
  line("ROUTE_CL", 1, g(0,0), g(0,L));
  [[-hw,-hw],[hw,hw]].forEach(([a]) => line("SURVEY_LIMIT", 6, g(a, 0), g(a, L)));
  line("SURVEY_LIMIT", 6, g(-hw,0), g(hw,0)); line("SURVEY_LIMIT", 6, g(-hw,L), g(hw,L));
  r.seq.forEach(l => {
    const lay = l.kind === "hf" ? "HF_LINES" : "SSS_LINES", col = l.kind === "hf" ? 3 : 5;
    line(lay, col, g(l.off, l.sol), g(l.off, l.eol));
    line("VESSEL_RUNIN_OVERRUN", 8, g(l.off, l.join), g(l.off, l.sol));
    line("VESSEL_RUNIN_OVERRUN", 8, g(l.off, l.eol), g(l.off, l.vend));
    const ah = l.dir*Math.min(30, th*2);
    line(lay, col, g(l.off - ah*0.4, l.eol - ah), g(l.off, l.eol)); line(lay, col, g(l.off + ah*0.4, l.eol - ah), g(l.off, l.eol));
    text("LABELS", 7, g(l.off - th*0.4, (l.y0 + l.y1)/2), th, `${String(l.order).padStart(2,"0")} ${l.name} ${l.dir>0?"up-KP":"down-KP"}`);
  });
  P(0,"ENDSEC"); P(0,"EOF");
  return out.join("\r\n") + "\r\n";
}
function summaryText(r){
  const p = r.p, h = r.hrs;
  return [
    `SSS run-line plan — ${r.M.label}, design on ${fmt(r.ch.f)} kHz`,
    `${p.mode==="route" ? `Route ${fmt(r.length/1000,2)} km, corridor ${fmt(r.corridor)} m` : `Area ${fmt(r.corridor)} m wide × ${fmt(r.length)} m long (${fmt(r.corridor*r.length/1e6,2)} km²)`}, water depth ${fmt(p.wd)} m`,
    `Range ${fmt(r.R)} m/side, altitude ${fmt(r.h,1)} m, swath ${fmt(r.W)} m, ${r.two?"200":"100"} % coverage, spacing ${fmt(r.S,1)} m, sidelap ${fmt(r.sidelapAct*100,1)} %, nadir gap ${fmt(2*r.xin)} m`,
    `${r.n} lines${r.hf ? ` + HF pair at ±${fmt(r.hf.off)} m (range ${fmt(r.hf.R)} m, alt ${fmt(r.hf.h,1)} m)` : ""}, fish data ${fmt(r.dataKm,1)} km`,
    `Speed ${fmt(p.speed,1)} kn, ${p.cab.label.split(" · ")[0]} cable: cable out ${fmt(r.CO)} m (likely ${fmt(r.main.coLo)}–${fmt(r.main.coHi)}), layback ${fmt(r.LB)} m (likely ${fmt(r.main.lbLo)}–${fmt(r.main.lbHi)}), catenary factor ${fmt(r.main.cf,2)}${r.hf ? `; HF pair ${fmt(r.hf.CO)} / ${fmt(r.hf.LB)} m` : ""}`,

    `Subtotal ${fmt(h.subtotal,2)} h + contingency ${fmt(p.cont)} % = ${fmt(h.total,2)} h (${fmt(h.days,2)} day at ${p.dayH} h/day)`
  ].join("\n");
}
let toastT;
function toast(msg, bad){ const t = $("toast"); t.textContent = msg; t.style.color = bad ? "var(--bad)" : "var(--ok)"; clearTimeout(toastT); toastT = setTimeout(() => t.textContent = "", 4000); }

let downloads = null;
async function saveFile(filename, data){

  try { await downloads.save({filename, data}); toast(`Saved ${filename}`); }
  catch (e) {
    const code = e && e.code;
    if (code === "declined") toast("Download cancelled.");
    else if (code === "rate_limited") toast("Another save is waiting for your answer.", true);

  }
}

function fallbackCopy(txt){

/* ---------- storage (per-viewer convenience) ---------- */
const KEY = "sss-runline-planner-v6";

function save(p){ clearTimeout(saveT); saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(snapshot())); } catch(e){} }, 400); }
function snapshot(){

}

/* ---------- wiring ---------- */
$("model").innerHTML = Object.entries(MODELS).map(([k,m]) => `<option value="${k}">${esc(m.label)}</option>`).join("");
function applyChannelDefaults(){
  const p = readParams(), M = getModel(p), ch = M.ch[p.channel];
  const R = defRange(ch); $("range").value = R; $("alt").value = Math.round(R*0.1*2)/2;
  const hr = defRange(M.ch.HF); $("hfAlt").value = Math.round(hr*0.1*2)/2;
}
$("model").addEventListener("change", () => { populateChannel(); applyChannelDefaults(); syncVisibility(); commitLimits(); schedule(); });
$("channel").addEventListener("change", () => { applyChannelDefaults(); commitLimits(); schedule(); });
$("alt10").addEventListener("click", () => { const R = parseFloat($("range").value); if (isFinite(R)) { $("alt").value = Math.round(R*0.1*2)/2; schedule(); } });
$("resetBtn").addEventListener("click", () => { try { localStorage.removeItem(KEY); } catch(e){} writeParams(DEFAULTS); schedule(); });
let raf = 0;
function schedule(){ if (raf) return; raf = requestAnimationFrame(() => { raf = 0; try { render(); } catch(e){ console.error(e); } }); }
$("form").addEventListener("input", schedule);
$("form").addEventListener("change", e => { if (e.target && LIM_IDS.includes(e.target.id)) commitLimits(); schedule(); });
$("form").addEventListener("submit", e => e.preventDefault());
$("noGap").addEventListener("click", e => { const b = e.target.closest("#noGapBtn"); if (!b) return;
  $("cov200").checked = true; $("cov100").checked = false; $("sidelap").value = Math.max(parseFloat($("sidelap").value)||0, +b.dataset.pct); schedule(); });
["calV","calL","calD"].forEach(id => $(id).addEventListener("input", schedule));
$("calClear").addEventListener("click", () => { ["calV","calL","calD"].forEach(id => $(id).value = ""); schedule(); });
function chartHover(ev){
  if (!LAST || !CHART) return;
  const svg = $("towChart").querySelector("svg"), tip = $("towTip"), cross = svg && svg.querySelector("#towCross");
  if (!svg || !tip) return;
  const rc = svg.getBoundingClientRect(), pt = ev.touches ? ev.touches[0] : ev;
  const xv = (pt.clientX - rc.left)/rc.width*CHART.VW;
  if (xv < CHART.pl || xv > CHART.VW - CHART.pr){ tip.hidden = true; if (cross) cross.style.visibility = "hidden"; return; }
  const v = Math.round((CHART.v0 + (xv - CHART.pl)/(CHART.VW - CHART.pl - CHART.pr)*(CHART.v1 - CHART.v0))*20)/20, q = towAt(LAST, v);
  const xs = CHART.pl + (v - CHART.v0)/(CHART.v1 - CHART.v0)*(CHART.VW - CHART.pl - CHART.pr);
  if (cross){ cross.setAttribute("x1", xs); cross.setAttribute("x2", xs); cross.style.visibility = "visible"; }
  tip.hidden = false;
  tip.innerHTML = `${fmt(v,2)} kn<br>cable out ${fmt(q.co)} m (${fmt(q.coLo)}–${fmt(q.coHi)})<br>layback ${fmt(q.lb)} m`;
  tip.style.left = Math.min(Math.max(xs/CHART.VW*rc.width, 90), rc.width - 90) + "px"; tip.style.top = (pt.clientY - rc.top) + "px";
}
$("towChart").addEventListener("mousemove", chartHover);
$("towChart").addEventListener("touchstart", chartHover, {passive:true});
$("towChart").addEventListener("touchmove", chartHover, {passive:true});
$("towChart").addEventListener("mouseleave", () => { const t = $("towTip"); if (t) t.hidden = true; const c = $("towChart").querySelector("#towCross"); if (c) c.style.visibility = "hidden"; });

// start: saved state, else the defaults
let start = DEFAULTS;
try { const s = localStorage.getItem(KEY); if (s) { const o = JSON.parse(s); if (o && MODELS[o.model]) start = Object.assign({}, DEFAULTS, o); } } catch(e){}
$("model").value = start.model; populateChannel();
writeParams(start);
render();
})();
<\/script>
</body>
</html>
</script>

.f.full{grid-template-columns:minmax(0,1fr)}

.readout b{color:var(--ink);font-weight:500}
.inline-btn{display:flex;justify-content:flex-end;margin-top:-2px}
.fixed{font-size:.75rem;color:var(--muted);line-height:1.5;margin:8px 0 0}
.lim{font:.68rem/1.3 var(--f-mono);color:var(--muted);text-align:right;margin:-5px 0 6px}

.inp.over{border-color:var(--warn);box-shadow:0 0 0 3px var(--warn-soft)}
main.out{display:grid;gap:22px;min-width:0;align-content:start}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px 14px;min-width:0;display:flex;flex-direction:column;gap:3px}
.kpi .k{font:500 .68rem var(--f-mono);letter-spacing:.11em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px;align-items:center}
.kpi .v{font-weight:600;font-size:1.65rem;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.kpi .v small{font-size:.9rem;font-weight:500;color:var(--muted);margin-left:3px}
.kpi .s{font-size:.8rem;color:var(--muted);line-height:1.35}
.kpi.total{background:var(--ui-soft);border-color:transparent}
.kpi.total .v{color:var(--ui)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;min-width:0}
.card .head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;align-items:baseline;margin-bottom:12px}
.card h2{font-weight:600;font-size:1.05rem;margin:0;text-wrap:balance}
.card h3{font-size:.9rem;font-weight:600;margin:0 0 8px}
.note{font-size:.8rem;color:var(--muted)}
.fig{overflow-x:auto}
.fig svg{display:block;width:100%;height:auto}
#fvWrap svg{min-width:700px;cursor:crosshair}
#planWrap svg{min-width:640px}

.viewopts .cursor{margin-left:auto;font:.74rem var(--f-mono);color:var(--muted);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.78rem;color:var(--muted);margin-top:12px}
.advice{margin-top:12px;padding:10px 12px;border-radius:9px;background:var(--panel-2);font-size:.85rem;line-height:1.45}
.advice b{font-weight:600}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.towgrid{display:grid;gap:18px 24px;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);align-items:start}
@media (max-width:980px){.towgrid{grid-template-columns:minmax(0,1fr)}}
#denTable td:first-child,#ordTable td:first-child{white-space:normal}
@media (min-width:1180px){#checks{grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:30px}}
.two{display:grid;gap:22px;grid-template-columns:minmax(0,.8fr) minmax(0,1.3fr)}
@media (max-width:960px){.two{grid-template-columns:minmax(0,1fr)}}
.pill{display:inline-block;font:500 .66rem var(--f-mono);letter-spacing:.07em;padding:2px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap;text-align:center}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--panel-2);color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.checks li{display:grid;grid-template-columns:58px minmax(0,1fr);gap:10px;align-items:start;font-size:.85rem;line-height:1.45}
.checks li .pill{margin-top:2px}
.checks li b{font-weight:600}
.tablewrap{overflow:auto;max-height:440px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
#hrsTable td:first-child{white-space:normal;min-width:150px}
th:first-child,td:first-child,th.l,td.l{text-align:left}
thead th{position:sticky;top:0;background:var(--panel-2);font:500 .66rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);z-index:1}
tbody tr:last-child td{border-bottom:0}
tr.sub td{font-weight:600;background:var(--panel-2)}
tr.tot td{font-weight:600;background:var(--ui-soft);color:var(--ui)}
td .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:0}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;margin:2px 0 14px;background:var(--panel-2)}
.bar span{display:block;height:100%}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toast{font-size:.8rem;color:var(--ok);min-height:1.2em}
details.how{font-size:.86rem;color:var(--muted)}
details.how summary{cursor:pointer;color:var(--ink);font-weight:500}
details.how ul{margin:10px 0 0;padding-left:18px;display:grid;gap:5px;max-width:95ch}
footer.fine{font-size:.76rem;color:var(--muted);max-width:100ch;margin-top:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div>
      <p class="eyebrow">Multibeam echo sounder · R2Sonic · Kongsberg · NORBIT · Teledyne</p>
      <h1>Multibeam Run-line Planner</h1>
      <p class="sub">Enter the sonar, survey size, depth and speed. Swath, line spacing, sounding density, run-lines and operation hours update as you type.</p>
    </div>
  </header>

  <div class="app">
    <form class="controls" id="form" autocomplete="off">
      <fieldset>
        <legend>Sonar</legend>
        <div class="f full"><div class="inp"><select id="model" aria-label="Sonar model"></select></div></div>
        <div class="f full"><div class="inp"><select id="freq" aria-label="Operating frequency"></select></div></div>
        <div class="readout" id="sonarReadout"></div>
        <div class="f"><label for="sector">Swath sector</label><div class="inp"><input id="sector" type="number" step="5" min="10"><span class="u">°</span></div></div>
        <div class="lim" id="lim_sector"></div>
        <div class="f"><label for="tilt">Sector steering (+ to starboard)</label><div class="inp"><input id="tilt" type="number" step="1"><span class="u">°</span></div></div>
        <div class="lim" id="lim_tilt"></div>
        <div class="seg" role="radiogroup" aria-label="Beam spacing">
          <input type="radio" name="beams" id="beamED" value="ED"><label for="beamED">Equidistant</label>
          <input type="radio" name="beams" id="beamEA" value="EA"><label for="beamEA">Equiangular</label>
        </div>
        <label class="chk" for="dualRx" id="dualRxRow"><input type="checkbox" id="dualRx"> <span id="dualRxTxt">Dual receiver / dual head</span></label>
        <label class="chk" for="dualSwath" id="dualSwathRow"><input type="checkbox" id="dualSwath"> Dual swath (two swaths per ping)</label>
      </fieldset>

      <fieldset>
        <legend>Platform and depth</legend>
        <div class="seg" role="radiogroup" aria-label="Platform">
          <input type="radio" name="platform" id="platSurface" value="surface"><label for="platSurface">Surface vessel</label>
          <input type="radio" name="platform" id="platRov" value="rov"><label for="platRov">ROV / AUV</label>
        </div>
        <div class="f"><label for="wd" id="wdLabel">Water depth at centre line</label><div class="inp"><input id="wd" type="number" step="1" min="1"><span class="u">m</span></div></div>
        <div class="lim" id="lim_wd"></div>
        <div class="f" id="draftRow"><label for="draft">Sonar head draft</label><div class="inp"><input id="draft" type="number" step="0.1" min="0"><span class="u">m</span></div></div>
        <div class="f" id="altRow"><label for="alt">Vehicle altitude</label><div class="inp"><input id="alt" type="number" step="1" min="0.5"><span class="u">m</span></div></div>
        <div class="lim" id="lim_alt"></div>
        <div class="f"><label for="slope">Seabed cross-slope (+ deeper to starboard)</label><div class="inp"><input id="slope" type="number" step="1"><span class="u">°</span></div></div>
      </fieldset>

      <fieldset>
        <legend>Survey</legend>
        <div class="seg" role="radiogroup" aria-label="Survey type">
          <input type="radio" name="mode" id="modeRoute" value="route"><label for="modeRoute">Pipeline</label>
          <input type="radio" name="mode" id="modeArea" value="area"><label for="modeArea">Area</label>
        </div>
        <div id="routeBox">
          <div class="f"><label for="routeKm">Pipeline length</label><div class="inp"><input id="routeKm" type="number" step="0.1" min="0.05"><span class="u">km</span></div></div>
          <div class="f"><label for="corrW">Corridor width</label><div class="inp"><input id="corrW" type="number" step="50" min="10"><span class="u">m</span></div></div>
        </div>
        <div id="areaBox" hidden>
          <div class="f"><label for="areaW">Width (across lines)</label><div class="inp"><input id="areaW" type="number" step="50" min="20"><span class="u">m</span></div></div>
          <div class="f"><label for="areaL">Length (along lines)</label><div class="inp"><input id="areaL" type="number" step="50" min="50"><span class="u">m</span></div></div>
          <div class="lim" id="areaOut"></div>
        </div>
        <div class="f full"><div class="inp"><select id="order" aria-label="IHO S-44 order"></select></div></div>
        <div class="seg" role="radiogroup" aria-label="Coverage">
          <input type="radio" name="coverage" id="cov100" value="100"><label for="cov100">100 %</label>
          <input type="radio" name="coverage" id="cov200" value="200"><label for="cov200">200 % · double</label>
        </div>
        <div class="f"><label for="overlap">Overlap between lines</label><div class="inp"><input id="overlap" type="number" step="5" min="0" max="80"><span class="u">%</span></div></div>
        <div class="f"><label for="ext">Extend lines past ends</label><div class="inp"><input id="ext" type="number" step="10" min="0"><span class="u">m</span></div></div>
        <div class="f"><label for="xlines">Cross lines (checks)</label><div class="inp"><input id="xlines" type="number" step="1" min="0"><span class="u">no.</span></div></div>
      </fieldset>

      <fieldset>
        <legend>Speed and time</legend>
        <div class="f"><label for="speed">Survey speed</label><div class="inp"><input id="speed" type="number" step="0.5" min="0.5"><span class="u">kn</span></div></div>
        <div class="lim" id="lim_speed"></div>
        <div class="f"><label for="pre">Mobilisation, patch test, checks</label><div class="inp"><input id="pre" type="number" step="0.5" min="0"><span class="u">h</span></div></div>
        <div class="f"><label for="cont">Weather contingency</label><div class="inp"><input id="cont" type="number" step="1" min="0"><span class="u">%</span></div></div>
        <p class="fixed">Fixed: sound speed 1,500 m/s, range scale 10 % beyond the swath edge, 10 % infill and re-runs, 120°/min turns, 100 m run-in before SOL, 20 m overrun, sound velocity cast every 6 h (0.5 h each). Transit to site is not included. Sonar figures are nominal datasheet values; those marked est. are planning estimates.</p>
        <div class="inline-btn"><button class="btn small" type="button" id="resetBtn">Reset inputs</button></div>
      </fieldset>
    </form>

    <\!-- ======================= OUTPUT ======================= -->
    <main class="out">
      <section class="kpis" id="kpis" aria-label="Key numbers"></section>

      <section class="card" aria-labelledby="fvTitle">
        <div class="head">
          <h2 id="fvTitle">Front-view swath · coverage, overlap and line spacing</h2>
          <span class="note" id="fvNote"></span>
        </div>
        <div class="viewopts">
          <label class="chk" for="showRays"><input type="checkbox" id="showRays" checked> Acoustic rays</label>
          <label class="chk" for="showOverlap"><input type="checkbox" id="showOverlap" checked> Overlap zone</label>
          <label class="chk" for="showAdj"><input type="checkbox" id="showAdj" checked> Adjacent lines</label>
          <span class="cursor" id="cursorPos">X: – m | depth: – m</span>
        </div>
        <div class="fig" id="fvWrap"></div>
        <div class="legend" id="fvLegend"></div>
        <div class="advice" id="fvAdvice"></div>
      </section>

      <section class="card" aria-labelledby="denTitle">
        <div class="head">
          <h2 id="denTitle">Sounding density and beam footprint</h2>
          <span class="note" id="denHead"></span>
        </div>
        <div class="towgrid">
          <div>
            <div class="tablewrap"><table id="denTable"></table></div>
            <p class="note" id="denNote" style="margin:10px 0 0"></p>
          </div>
          <div>
            <h3 id="ordTitle">IHO S-44 requirement</h3>
            <div class="tablewrap"><table id="ordTable"></table></div>
            <p class="note" style="margin:10px 0 0">Allowed uncertainties are at 95 % confidence, from IHO S-44 Edition 6. This planner does not compute your achieved uncertainty: use a total propagated uncertainty model with your own sensor offsets, motion sensor and sound velocity figures.</p>

        <details class="how">
          <summary>How the numbers are worked out</summary>
          <ul>
            <li><b>Height over the seabed</b> H is water depth minus head draft for a surface vessel, or the vehicle altitude for an ROV or AUV.</li>
            <li><b>Swath</b>: the port edge is at sector ÷ 2 − steering from nadir and the starboard edge at sector ÷ 2 + steering. On a flat seabed each side reaches H × tan(angle). On a cross-slope of angle s the reach is H × tan(angle) ÷ (1 ∓ tan(angle) × tan(s)): longer on the down-slope side, shorter up-slope. A beam whose slant range would pass the frequency's reach is cut back to that range, and beams at or above horizontal never count.</li>
            <li><b>Line spacing</b> = usable swath × (1 − overlap) for 100 % coverage, half of that for 200 %. The usable swath is the narrowest pairing of neighbouring lines: lines are run in alternate directions, so a steered sector is mirrored on every second line and the narrow sides meet. For a surface vessel on a cross-slope the spacing is designed at the shallow edge of the corridor, where the swath is narrowest. Spacing is rounded down to a whole metre.</li>
            <li><b>Number of lines</b> is the smallest set, centred on the centre line, whose real swaths (each at its own depth and direction) give the coverage target across the whole width.</li>
            <li><b>Ping rate</b> = sound speed ÷ (2 × 1.1 × slant range to the far swath edge of the deepest line), capped at the sonar's maximum. Dual swath doubles the swaths per second.</li>
            <li><b>Sounding spacing</b>: equidistant mode spreads the soundings evenly across the swath; equiangular mode spaces them H × Δθ apart at nadir, growing by 1 ÷ cos² of the beam angle. Along-track spacing is speed ÷ swaths per second. Density is one sounding per across × along cell.</li>
            <li><b>Beam footprint</b>: across-track H × receive beam width at nadir, growing by 1 ÷ cos² of the beam angle on a flat seabed, and by a further 1 ÷ cos for flat arrays as the receive beam is steered (not for the curved NORBIT array). Along-track it is slant range × transmit beam width. Outer-beam depths come from phase detection inside the footprint, so the footprint is a guide to what a beam illuminates, not its depth resolution.</li>
            <li><b>Feature detection</b> uses the common working rule of at least 3 soundings across and 3 pings along the smallest feature of the chosen IHO order, tested at the swath edge. It is a planning rule, not an IHO figure.</li>
            <li><b>Hours</b>: on-line, run-in and turn time at survey speed, plus cross lines, 10 % infill, sound velocity casts and your mobilisation time. The contingency % is applied to that subtotal.</li>
          </ul>
        </details>
