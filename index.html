<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sub-Bottom Fast Viewer</title>
    <!-- Load Plotly for the Navigation Map -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background-color: #0f1419;
            color: #e4e6eb;
            margin: 0; 
            padding: 20px; 
        }

        .container { 
            max-width: 1440px; 
            margin: auto; 
        }

        header {
            margin-bottom: 20px;
        }

        h2 { 
            font-size: 1.3rem;
            font-weight: 600;
            color: #e4e6eb;
            margin: 0 0 6px 0; 
        }

        .subtitle {
            color: #a0aec0;
            font-size: 0.9rem;
            margin: 0;
        }

        .card {
            background: #1a1f2e;
            padding: 16px; 
            border-radius: 8px; 
            border: 1px solid #2d3748;
            margin-bottom: 16px;
        }

        .controls { 
            display: flex; 
            flex-wrap: wrap;
            gap: 16px; 
            align-items: center; 
        }

        input[type="file"] { 
            font-size: 13px; 
            color: #a0aec0;
            cursor: pointer;
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #e4e6eb;
        }

        input[type="range"] {
            accent-color: #3b82f6;
            cursor: pointer;
            height: 5px;
        }

        #status { 
            font-weight: 500; 
            font-size: 0.9rem;
            color: #60a5fa;
            margin-left: auto;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #e4e6eb;
        }

        .btn-reset {
            background: #2d3748;
            border: 1px solid #4a5568;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #cbd5e0;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-reset:hover {
            background: #4a5568;
            color: #e4e6eb;
        }

        /* Canvas Viewport */
        .canvas-container {
            position: relative;
            display: flex;
            gap: 0;
        }

        .depth-scale {
            width: 50px;
            background: #0f1419;
            border: 1px solid #2d3748;
            border-radius: 0 0 0 8px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px 0;
            font-size: 0.75rem;
            color: #a0aec0;
        }

        .canvas-viewport { 
            flex: 1;
            height: 500px; 
            background: #0a0d12; 
            border: 1px solid #2d3748; 
            border-radius: 0 8px 8px 0;
            position: relative;
            overflow: hidden;
            cursor: grab;
        }

        .canvas-viewport:active {
            cursor: grabbing;
        }

        canvas { 
            display: block; 
            width: 100%;
            height: 100%;
        }

        .canvas-hud {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(15, 20, 41, 0.85);
            color: #cbd5e0;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid #2d3748;
            line-height: 1.4;
        }

        .canvas-pointer-info {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(15, 20, 41, 0.85);
            color: #60a5fa;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid #2d3748;
            font-family: 'Courier New', monospace;
            line-height: 1.4;
        }

        #navMap { 
            width: 100%; 
            height: 400px; 
            border-radius: 8px;
        }

        .plotly-container {
            background: #1a1f2e;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Geophysical Sub-Bottom Fast Viewer</h2>
        <p class="subtitle">Client-side high performance SEG-Y trace and trackline visualizer</p>
    </header>
    
    <div class="card">
        <div class="controls">
            <input type="file" id="sgyFile" accept=".sgy,.segy">
            <div class="slider-group">
                <label for="clipSlider">Amplitude Clip:</label>
                <input type="range" id="clipSlider" min="90" max="99.9" step="0.1" value="98">
                <span id="clipValue">98</span>%
            </div>
            <span id="status">Waiting for file upload...</span>
        </div>
    </div>

    <div class="card">
        <div class="section-header">
            <div class="section-title">Sub-Bottom Profile</div>
            <button class="btn-reset" id="resetViewBtn">Reset View</button>
        </div>
        <div class="canvas-container">
            <div class="depth-scale" id="depthScale"></div>
            <div class="canvas-viewport" id="viewport">
                <canvas id="seismicCanvas"></canvas>
                <div class="canvas-hud">Scroll: zoom | Drag: pan</div>
                <div class="canvas-pointer-info" id="pointerInfo"></div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="section-title">Survey Trackline (Longitude / Latitude)</div>
        <div id="navMap"></div>
    </div>
</div>

<script>
    let globalTraces = [];
    let globalNavX = [];
    let globalNavY = [];
    let samplingInterval = 1; // meters per sample (default)
    
    // Offscreen rendering cache
    let offscreenCanvas = document.createElement('canvas');
    let offscreenCtx = offscreenCanvas.getContext('2d');

    // Pan & Zoom View State
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let mouseCanvasX = 0;
    let mouseCanvasY = 0;

    const sgyInput = document.getElementById('sgyFile');
    const clipSlider = document.getElementById('clipSlider');
    const clipValue = document.getElementById('clipValue');
    const statusTxt = document.getElementById('status');
    const viewport = document.getElementById('viewport');
    const canvas = document.getElementById('seismicCanvas');
    const ctx = canvas.getContext('2d');
    const resetViewBtn = document.getElementById('resetViewBtn');
    const pointerInfo = document.getElementById('pointerInfo');
    const depthScale = document.getElementById('depthScale');

    // Resize canvas to match container
    function initCanvasSize() {
        const rect = viewport.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        updateDepthScale();
        drawScene();
    }
    window.addEventListener('resize', initCanvasSize);

    clipSlider.addEventListener('input', (e) => {
        clipValue.textContent = e.target.value;
    });

    clipSlider.addEventListener('change', () => {
        if(globalTraces.length > 0) {
            buildSeismicCache();
            drawScene();
        }
    });

    resetViewBtn.addEventListener('click', () => {
        resetView();
    });

    // Mouse Controls
    viewport.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
    });

    window.addEventListener('mousemove', (e) => {
        const rect = viewport.getBoundingClientRect();
        mouseCanvasX = e.clientX - rect.left;
        mouseCanvasY = e.clientY - rect.top;

        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateDepthScale();
        drawScene();
    });

    viewport.addEventListener('mousemove', (e) => {
        if (globalTraces.length === 0) return;
        updatePointerInfo();
    });

    window.addEventListener('mouseup', () => {
        isDragging = false;
    });

    viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomIntensity = 0.12;
        const wheel = e.deltaY < 0 ? 1 : -1;
        const zoomFactor = Math.exp(wheel * zoomIntensity);

        const rect = viewport.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        panX = mouseX - (mouseX - panX) * zoomFactor;
        panY = mouseY - (mouseY - panY) * zoomFactor;
        scale *= zoomFactor;

        scale = Math.max(0.2, Math.min(scale, 50));

        updateDepthScale();
        drawScene();
    }, { passive: false });

    function resetView() {
        scale = 1;
        panX = 0;
        panY = 0;
        updateDepthScale();
        drawScene();
    }

    function updateDepthScale() {
        depthScale.innerHTML = '';
        if (globalTraces.length === 0) return;

        const height = globalTraces[0].length;
        const viewportHeight = viewport.clientHeight;
        const pixelsPerMeter = (height * scale) / (samplingInterval * height);
        const scalePx = viewportHeight;

        // Calculate interval spacing
        const targetPixelInterval = 40;
        const meterInterval = 5;
        const pixelInterval = (meterInterval / samplingInterval) * scale;

        let startSample = Math.max(0, Math.floor(-panY / scale));
        let endSample = Math.min(height, Math.ceil((viewportHeight - panY) / scale));

        for (let sample = Math.ceil(startSample / meterInterval) * meterInterval; sample <= endSample; sample += meterInterval) {
            const depthMeters = sample * samplingInterval;
            const canvasPy = sample * scale + panY;

            if (canvasPy >= 0 && canvasPy <= viewportHeight) {
                const tick = document.createElement('div');
                tick.style.position = 'absolute';
                tick.style.top = canvasPy + 'px';
                tick.style.width = '100%';
                tick.style.height = '1px';
                tick.style.background = '#2d3748';
                tick.style.fontSize = '0.7rem';
                tick.style.color = '#a0aec0';
                tick.style.textAlign = 'center';
                tick.style.lineHeight = '1px';
                tick.style.paddingTop = '2px';
                tick.textContent = depthMeters;
                depthScale.appendChild(tick);
            }
        }
    }

    function updatePointerInfo() {
        if (globalTraces.length === 0) return;

        const rect = viewport.getBoundingClientRect();
        const canvasX = (mouseCanvasX - panX) / scale;
        const canvasY = (mouseCanvasY - panY) / scale;

        const traceIdx = Math.floor(canvasX);
        const sampleIdx = Math.floor(canvasY);

        if (traceIdx >= 0 && traceIdx < globalTraces.length && 
            sampleIdx >= 0 && sampleIdx < globalTraces[0].length) {
            
            const easting = globalNavX[traceIdx] || 0;
            const northing = globalNavY[traceIdx] || 0;
            const depth = sampleIdx * samplingInterval;

            pointerInfo.innerHTML = `E: ${easting.toFixed(2)}<br>N: ${northing.toFixed(2)}<br>D: ${depth.toFixed(1)}m`;
        }
    }

    sgyInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        statusTxt.textContent = "Reading file...";
        const reader = new FileReader();
        reader.onload = function(event) {
            statusTxt.textContent = "Parsing SEG-Y...";
            const arrayBuffer = event.target.result;
            parseSegy(arrayBuffer);
        };
        reader.readAsArrayBuffer(file);
    });

    function parseSegy(buffer) {
        try {
            const dataView = new DataView(buffer);
            const formatCode = dataView.getInt16(3224, false); 
            
            if (formatCode !== 5 && formatCode !== 1) {
                alert("Unsupported format: " + formatCode + ". Use IEEE Float (5).");
                statusTxt.textContent = "Error: Unsupported format.";
                return;
            }

            let offset = 3600; 
            globalTraces = [];
            globalNavX = [];
            globalNavY = [];
            
            statusTxt.textContent = "Extracting traces...";

            // Get first trace to determine sampling
            const dataView2 = new DataView(buffer);
            const numSamples = dataView2.getInt16(3600 + 114, false);
            const sampleInterval = dataView2.getInt16(3600 + 116, false);
            samplingInterval = sampleInterval > 0 ? sampleInterval / 1000000 : 1;

            while (offset < buffer.byteLength) {
                let scalar = dataView.getInt16(offset + 70, false);
                let sx = dataView.getInt32(offset + 72, false);
                let sy = dataView.getInt32(offset + 76, false);
                let numSamples = dataView.getInt16(offset + 114, false);
                
                let mult = 1.0;
                if (scalar < 0) mult = 1.0 / Math.abs(scalar);
                else if (scalar > 0) mult = scalar;
                
                let actualX = sx * mult;
                let actualY = sy * mult;
                
                if (actualX !== 0 || actualY !== 0) {
                    globalNavX.push(actualX);
                    globalNavY.push(actualY);
                }

                let traceData = new Float32Array(numSamples);
                let traceOffset = offset + 240; 
                
                for (let i = 0; i < numSamples; i++) {
                    traceData[i] = dataView.getFloat32(traceOffset + (i * 4), false);
                }
                
                globalTraces.push(traceData);
                offset += 240 + (numSamples * 4);
            }

            initCanvasSize();
            buildSeismicCache();
            resetView();
            renderNavigation();
            statusTxt.textContent = `Success: ${globalTraces.length} traces.`;

        } catch (error) {
            console.error(error);
            statusTxt.textContent = "Error parsing file.";
        }
    }

    function buildSeismicCache() {
        if (globalTraces.length === 0) return;
        
        const width = globalTraces.length;
        const height = globalTraces[0].length; 
        
        offscreenCanvas.width = width;
        offscreenCanvas.height = height;

        let sampleValues = [];
        for (let i = 0; i < width; i += 10) { 
            for (let j = 0; j < height; j += 10) {
                sampleValues.push(Math.abs(globalTraces[i][j]));
            }
        }
        sampleValues.sort((a, b) => a - b);
        let pctIndex = Math.floor(sampleValues.length * (parseFloat(clipSlider.value) / 100));
        let clipVal = sampleValues[pctIndex];

        const imgData = offscreenCtx.createImageData(width, height);
        let dataIndex = 0;
        
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                let val = globalTraces[x][y];
                
                if (val > clipVal) val = clipVal;
                if (val < -clipVal) val = -clipVal;
                
                let normalized = (val + clipVal) / (2 * clipVal);
                let r = 0, g = 0, b = 0;
                
                if (normalized < 0.5) {
                    let t = normalized * 2; 
                    r = Math.round(16 + t * (255 - 16));  
                    g = Math.round(78 + t * (255 - 78));  
                    b = Math.round(139 + t * (255 - 139));
                } else {
                    let t = (normalized - 0.5) * 2; 
                    r = Math.round(255 - t * (255 - 139)); 
                    g = Math.round(255 - t * 255);         
                    b = Math.round(255 - t * 255);         
                }

                imgData.data[dataIndex++] = r; 
                imgData.data[dataIndex++] = g; 
                imgData.data[dataIndex++] = b; 
                imgData.data[dataIndex++] = 255; 
            }
        }
        offscreenCtx.putImageData(imgData, 0, 0);
    }

    function drawScene() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        if (globalTraces.length === 0) return;

        ctx.save();
        ctx.translate(panX, panY);
        ctx.scale(scale, scale);
        ctx.drawImage(offscreenCanvas, 0, 0);
        ctx.restore();
    }

    function renderNavigation() {
        if (globalNavX.length === 0) return;

        const traceLine = {
            x: globalNavX,
            y: globalNavY,
            mode: 'lines',
            name: 'Vessel Track',
            line: {color: '#3b82f6', width: 2}
        };

        const startPoint = {
            x: [globalNavX[0]],
            y: [globalNavY[0]],
            mode: 'markers',
            name: 'Start',
            marker: {color: '#10b981', size: 8, symbol: 'circle'}
        };

        const endPoint = {
            x: [globalNavX[globalNavX.length - 1]],
            y: [globalNavY[globalNavY.length - 1]],
            mode: 'markers',
            name: 'End',
            marker: {color: '#ef4444', size: 8, symbol: 'square'}
        };

        const layout = {
            margin: { t: 20, r: 30, b: 50, l: 70 },
            xaxis: { 
                title: 'Longitude (E)', 
                scaleanchor: "y", 
                scaleratio: 1, 
                gridcolor: '#2d3748',
                showgrid: true
            },
            yaxis: { 
                title: 'Latitude (N)', 
                gridcolor: '#2d3748',
                showgrid: true
            },
            showlegend: true,
            paper_bgcolor: '#1a1f2e',
            plot_bgcolor: '#0f1419',
            font: { color: '#a0aec0' },
            legend: { bgcolor: 'rgba(26,31,46,0.8)', bordercolor: '#2d3748' }
        };

        Plotly.newPlot('navMap', [traceLine, startPoint, endPoint], layout, {responsive: true});
    }
</script>

</body>
</html>
